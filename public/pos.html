<!DOCTYPE html><html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS | Smatic</title><link rel="stylesheet" href="css/main.css">
<style>
.pos-container{display:grid;grid-template-columns:1fr 380px;gap:1em;height:calc(100vh - 100px);min-height:500px}
.pos-products{overflow-y:auto;background:#fff;border-radius:6px;padding:.5em}
.pos-products input[type=text]{width:100%;padding:.6em;font-size:1em;border:1px solid #ddd;border-radius:4px;margin-bottom:.5em;box-sizing:border-box}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.4em}
.product-card{border:1px solid #e8e8e8;border-radius:4px;padding:.4em;cursor:pointer;transition:box-shadow .1s;text-align:center}
.product-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);border-color:#007bff}
.product-card .p-name{font-size:.85em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.product-card .p-price{font-size:.9em;color:#007bff;font-weight:700}
.product-card .p-stock{font-size:.75em;color:#888}
.pos-cart{display:flex;flex-direction:column;background:#fff;border-radius:6px;overflow:hidden}
.pos-cart-header{background:#343a40;color:#fff;padding:.5em .8em;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pos-cart-header select{background:#fff;color:#333;border:none;border-radius:3px;padding:.2em .4em;font-size:.8em}
.pos-cart-items{flex:1;overflow-y:auto;padding:.4em}
.cart-item{display:flex;align-items:center;gap:.4em;padding:.3em 0;border-bottom:1px solid #f0f0f0;font-size:.85em}
.cart-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-item input[type=number]{width:50px;text-align:center;padding:.1em;border:1px solid #ddd;border-radius:3px}
.cart-item .item-price{min-width:55px;text-align:right;font-weight:600}
.cart-item .item-total{min-width:55px;text-align:right;color:#007bff;font-weight:700}
.cart-item .btn-remove{background:none;border:none;color:#d93025;cursor:pointer;font-size:1.1em;padding:0 .2em}
.cart-footer{padding:.5em .8em;border-top:2px solid #343a40}
.cart-total{font-size:1.3em;font-weight:700;text-align:right;margin-bottom:.5em}
.cart-payments{margin-bottom:.5em}
.payment-row{display:flex;gap:.3em;align-items:center;margin-bottom:.3em}
.payment-row select{flex:1;padding:.2em}
.payment-row input[type=number]{width:90px;text-align:right;padding:.2em}
.payment-row .btn-remove-pay{background:none;border:none;color:#d93025;cursor:pointer;font-size:1em}
.btn-checkout{width:100%;padding:.8em;font-size:1.1em;font-weight:700;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer}
.btn-checkout:hover{background:#218838}
.btn-checkout:disabled{background:#ccc;cursor:not-allowed}
.session-bar{display:flex;gap:.5em;align-items:center;margin-bottom:.5em;flex-wrap:wrap}
.session-bar .badge{background:#28a745;color:#fff;padding:.2em .6em;border-radius:3px;font-size:.8em;font-weight:600}
.session-bar .badge.closed{background:#6c757d}
.session-bar button{font-size:.8em;padding:.2em .6em}
.customer-select{width:100%;padding:.4em;border:1px solid #ddd;border-radius:3px;margin-bottom:.3em;box-sizing:border-box}
.pos-session-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5em}
</style>
</head>
<body>
<div class="navigation-wrapper" id="sidebar">
  <nav id="app-nav" class="navigation"></nav>
</div>
<div class="header-wrapper"><div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">☰</div><div class="breadcrumbs"><img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'"><span>Smatic - Punto de Venta</span></div></div>
<div class="container">
<div class="session-bar">
  <span id="sessionBadge" class="badge" style="display:none">Sesión: --</span>
  <span id="sessionInfo" style="font-size:.85em;color:#666"></span>
  <button id="btnOpenSession" onclick="openSession()" style="display:none">Abrir Caja</button>
  <button id="btnCloseSession" onclick="closeSession()" style="display:none">Cerrar Caja</button>
  <button onclick="showSessions()">Historial</button>
</div>
<div class="pos-container">
  <div class="pos-products">
    <input type="text" id="productSearch" placeholder="Buscar producto..." oninput="filterProducts()" autofocus>
    <div class="product-grid" id="productGrid"></div>
  </div>
  <div class="pos-cart">
    <div class="pos-cart-header">
      <span>🛒 Carrito</span>
      <select id="customerSelect" class="customer-select" style="width:auto;min-width:120px;background:#495057;color:#fff">
        <option value="">Consumidor Final</option>
      </select>
    </div>
    <div class="pos-cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-payments" id="paymentRows">
        <div class="payment-row">
          <select><option value="cash">Efectivo</option><option value="card">Tarjeta</option><option value="transfer">Transferencia</option><option value="other">Otro</option></select>
          <input type="number" step="0.01" class="pay-amount" placeholder="0.00" oninput="recalcPayments()">
          <button class="btn-remove-pay" onclick="this.parentElement.remove();recalcPayments()">✕</button>
        </div>
      </div>
      <button class="btn-secondary" style="width:100%;font-size:.8em;margin-bottom:.3em" onclick="addPaymentRow()">+ Agregar pago</button>
      <div class="cart-total" id="cartTotal">$ 0.00</div>
      <div id="paymentStatus" style="font-size:.85em;text-align:center;margin-bottom:.3em"></div>
      <button class="btn-checkout" id="btnCheckout" onclick="checkout()">Cobrar</button>
    </div>
  </div>
</div>
</div>
<script src="js/api.js"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if(!API.isAuthenticated()){window.location.href='/login.html';return;}
  await APP.init();
  if(APP.currentUser&&APP.currentUser.role==='superadmin')document.getElementById('admin-nav-link').classList.remove('hidden');
  await loadCustomers();
  await loadProducts();
  await loadCurrentSession();
});

// ── Products ──
let allItems = [];
async function loadProducts(){
  try{
    const d=await API.get('/api/pos/items');
    allItems=d.items||[];
    filterProducts();
  }catch(e){}
}
function filterProducts(){
  const q=document.getElementById('productSearch').value.toLowerCase();
  const filtered=allItems.filter(i=>i.name.toLowerCase().includes(q));
  document.getElementById('productGrid').innerHTML=filtered.map(i=>'<div class="product-card" onclick="addToCart(\''+APP.escAttr(i.id)+'\',\''+APP.escAttr(i.name)+'\','+i.sale_price+','+(i.stock_quantity||0)+')">'+
    '<div class="p-name">'+APP.esc(i.name)+'</div>'+
    '<div class="p-price">$ '+i.sale_price.toFixed(2)+'</div>'+
    '<div class="p-stock">Stock: '+(i.stock_quantity||0)+'</div>'+
  '</div>').join('');
}

// ── Cart ──
let cart=[];
function addToCart(id,name,price,stock){
  if(stock>0||!id){} // allow even if stock 0, let server enforce
  const existing=cart.find(c=>c.id===id);
  if(existing){existing.qty+=1;existing.total=existing.qty*existing.price;}
  else{cart.push({id,name,price:price||0,qty:1,total:price||0});}
  renderCart();
}
function renderCart(){
  const el=document.getElementById('cartItems');
  if(!cart.length){el.innerHTML='<div style="text-align:center;padding:2em;color:#999">Carrito vacío</div>';updateTotal();return;}
  el.innerHTML=cart.map((c,i)=>'<div class="cart-item">'+
    '<span class="cart-item-name">'+APP.esc(c.name)+'</span>'+
    '<input type="number" min="1" value="'+c.qty+'" onchange="updateQty('+i+',this.value)">'+
    '<span class="item-price">$'+c.price.toFixed(2)+'</span>'+
    '<span class="item-total">$'+c.total.toFixed(2)+'</span>'+
    '<button class="btn-remove" onclick="removeFromCart('+i+')">✕</button>'+
  '</div>').join('');
  updateTotal();
}
function updateQty(i,q){
  q=parseInt(q)||1;
  if(q<1)q=1;
  cart[i].qty=q;
  cart[i].total=q*cart[i].price;
  renderCart();
}
function removeFromCart(i){
  cart.splice(i,1);
  renderCart();
}
function updateTotal(){
  const total=cart.reduce((s,c)=>s+c.total,0);
  document.getElementById('cartTotal').textContent='$ '+total.toFixed(2);
  recalcPayments();
}

// ── Payments ──
function addPaymentRow(val){
  const row=document.createElement('div');
  row.className='payment-row';
  row.innerHTML='<select><option value="cash">Efectivo</option><option value="card">Tarjeta</option><option value="transfer">Transferencia</option><option value="other">Otro</option></select>'+
    '<input type="number" step="0.01" class="pay-amount" placeholder="0.00" oninput="recalcPayments()">'+
    '<button class="btn-remove-pay" onclick="this.parentElement.remove();recalcPayments()">✕</button>';
  if(val){
    row.querySelector('input').value=val;
  }
  document.getElementById('paymentRows').appendChild(row);
  recalcPayments();
}
function recalcPayments(){
  const total=cart.reduce((s,c)=>s+c.total,0);
  const payInputs=document.querySelectorAll('.pay-amount');
  let paySum=0;
  payInputs.forEach(inp=>{paySum+=parseFloat(inp.value)||0;});
  const btn=document.getElementById('btnCheckout');
  const st=document.getElementById('paymentStatus');
  if(paySum>=total-0.01&&total>0){
    st.textContent='✓ Monto cubierto';
    st.style.color='#28a745';
    btn.disabled=false;
  }else if(total>0){
    st.textContent='Faltan $'+(total-paySum).toFixed(2);
    st.style.color='#d93025';
    btn.disabled=true;
  }else{
    st.textContent='';
    btn.disabled=true;
  }
}

// ── Customers ──
async function loadCustomers(){
  try{
    const d=await API.get('/api/customers');
    const sel=document.getElementById('customerSelect');
    sel.innerHTML='<option value="">Consumidor Final</option>'+ (d.customers||[]).map(c=>'<option value="'+c.id+'">'+APP.esc(c.name)+'</option>').join('');
  }catch(e){}
}

// ── Sessions ──
let currentSession=null;
async function loadCurrentSession(){
  try{
    const d=await API.get('/api/pos/sessions');
    const sessions=d.sessions||[];
    currentSession=sessions.find(s=>s.status==='open')||null;
    renderSessionBar();
  }catch(e){renderSessionBar();}
}
function renderSessionBar(){
  const badge=document.getElementById('sessionBadge');
  const info=document.getElementById('sessionInfo');
  const btnOpen=document.getElementById('btnOpenSession');
  const btnClose=document.getElementById('btnCloseSession');
  if(currentSession){
    badge.style.display='inline-block';
    badge.textContent='Sesión activa';
    badge.className='badge';
    info.textContent='Apertura: '+APP.esc(currentSession.opened_at.slice(0,16));
    btnOpen.style.display='none';
    btnClose.style.display='inline-block';
  }else{
    badge.style.display='inline-block';
    badge.textContent='Sin sesión';
    badge.className='badge closed';
    info.textContent='Abra una caja para comenzar';
    btnOpen.style.display='inline-block';
    btnClose.style.display='none';
  }
}
async function openSession(){
  try{
    const d=await API.post('/api/pos/sessions/open',{opening_balance:0});
    currentSession=d.session;
    renderSessionBar();
  }catch(e){alert('Error: '+(e.message||''));}
}
async function closeSession(){
  if(!currentSession)return;
  const closingBalance=prompt('Ingrese cierre de caja:','0');
  if(closingBalance===null)return;
  try{
    await API.post('/api/pos/sessions/close',{session_id:currentSession.id,closing_balance:parseFloat(closingBalance)||0});
    currentSession=null;
    renderSessionBar();
  }catch(e){alert('Error: '+(e.message||''));}
}
function showSessions(){
  APP.modal('<div class="modal-content" style="max-width:600px"><span class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</span><h2>Historial de Sesiones</h2><div id="sessionHistory"></div></div>','');
  loadSessionHistory();
}
async function loadSessionHistory(){
  try{
    const d=await API.get('/api/pos/sessions');
    const list=d.sessions||[];
    let html='<table class="record-list"><thead><tr><th>Fecha</th><th>Estado</th><th>Apertura</th><th>Cierre</th><th>Efvo</th><th>Tarj</th><th>Transf</th></tr></thead><tbody>';
    for(const s of list){
      html+='<tr><td>'+APP.esc(s.session_date)+'</td><td>'+(s.status==='open'?'Abierta':'Cerrada')+'</td><td>$'+(s.opening_balance||0).toFixed(2)+'</td><td>$'+(s.closing_balance||0).toFixed(2)+'</td><td>$'+(s.cash_sales||0).toFixed(2)+'</td><td>$'+(s.card_sales||0).toFixed(2)+'</td><td>$'+(s.transfer_sales||0).toFixed(2)+'</td></tr>';
    }
    html+='</tbody></table>';
    document.getElementById('sessionHistory').innerHTML=html;
  }catch(e){}
}

// ── Checkout ──
async function checkout(){
  if(!cart.length)return;
  const session_id=currentSession?currentSession.id:null;
  const customer_id=document.getElementById('customerSelect').value;
  let customer_name='Consumidor Final';
  if(customer_id){
    const sel=document.getElementById('customerSelect');
    const opt=sel.options[sel.selectedIndex];
    if(opt)customer_name=opt.textContent;
  }
  const items=cart.map(c=>({id:c.id,name:c.name,price:c.price,qty:c.qty}));
  const payRows=document.querySelectorAll('.payment-row');
  const payments=[];
  payRows.forEach(row=>{
    const method=row.querySelector('select').value;
    const amount=parseFloat(row.querySelector('.pay-amount').value)||0;
    if(amount>0)payments.push({method,amount});
  });
  if(!payments.length){alert('Agregue al menos un pago');return;}
  try{
    const d=await API.post('/api/pos/checkout',{session_id,customer_id,customer_name,items,payments});
    alert('Venta registrada: '+d.invoice_number+' - Total: $'+d.total.toFixed(2));
    cart=[];
    renderCart();
    if(currentSession)await loadCurrentSession();
    await loadProducts();
  }catch(e){alert('Error: '+(e.message||''));}
}
</script>
</body>
</html>
