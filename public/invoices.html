<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title_invoices">Facturas | Smatic</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="navigation-wrapper" id="sidebar">
  <nav id="app-nav" class="navigation"></nav>
</div>

  <div class="header-wrapper">
    <div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">?</div>
    <div class="breadcrumbs">
      <img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'">
      <span data-i18n="breadcrumb_invoices">Smatic - Facturas</span>
    </div>
  </div>

  <div class="container" id="main-content">
    <div class="page-header">
      <h1 data-i18n="page_title_invoices">Facturas</h1>
      <div class="actions">
        <button onclick="window.location.href='new-invoice.html'">+ <span data-i18n="btn_new_invoice">Nueva Factura</span></button>
      </div>
    </div>

    <div class="filters">
      <select id="filter-status">
        <option value="" data-i18n="filter_all_statuses">Todos los estados</option>
        <option value="draft" data-i18n="status_draft">Borrador</option>
        <option value="sent" data-i18n="status_sent">Enviada</option>
        <option value="paid" data-i18n="status_paid">Pagada</option>
        <option value="partial" data-i18n="status_partial">Parcial</option>
        <option value="overdue" data-i18n="status_overdue">Vencida</option>
        <option value="cancelled" data-i18n="status_cancelled">Cancelada</option>
      </select>
      <input type="date" id="filter-date-from" data-i18n-placeholder="placeholder_date_from" placeholder="Desde">
      <input type="date" id="filter-date-to" data-i18n-placeholder="placeholder_date_to" placeholder="Hasta">
      <div class="search-box">
        <input type="text" id="filter-search" data-i18n-placeholder="placeholder_search_invoices" placeholder="Buscar factura o cliente...">
        <button onclick="applyFilters()" data-i18n="btn_search">Buscar</button>
      </div>
    </div>

    <div class="card">
      <div class="scroll-table">
        <table class="record-list" id="invoices-table">
          <thead>
            <tr>
              <th data-i18n="th_invoice_number">N° Factura</th>
              <th data-i18n="th_customer">Cliente</th>
              <th data-i18n="th_date">Fecha</th>
              <th data-i18n="th_due_date">Vencimiento</th>
              <th data-i18n="th_total">Total</th>
              <th data-i18n="th_status">Estado</th>
              <th data-i18n="th_actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="invoices-body">
            <tr><td colspan="7" class="text-center" style="color:#999" data-i18n="loading">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentPage = 1;
    let invoicesData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!API.isAuthenticated()) { window.location.href = '/login.html'; return; }
      await APP.init();
const params = new URLSearchParams(window.location.search);
      if (params.get('id')) {
        showInvoiceDetail(params.get('id'));
      }

      loadInvoices();
    });

    document.addEventListener('click', (e) => {
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 768 && sidebar.style.display === 'block' && !sidebar.contains(e.target) && !e.target.closest('.hamburger')) {
        sidebar.style.display = '';
      }
    });

    document.getElementById('filter-search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') applyFilters();
    });

    async function loadInvoices(page) {
      page = page || currentPage;
      const status = document.getElementById('filter-status').value;
      const search = document.getElementById('filter-search').value;
      const dateFrom = document.getElementById('filter-date-from').value;
      const dateTo = document.getElementById('filter-date-to').value;

      let url = '/api/invoices?page=' + page + '&limit=20';
      if (status) url += '&status=' + encodeURIComponent(status);
      if (search) url += '&search=' + encodeURIComponent(search);
      if (dateFrom) url += '&date_from=' + encodeURIComponent(dateFrom);
      if (dateTo) url += '&date_to=' + encodeURIComponent(dateTo);

      const tbody = document.getElementById('invoices-body');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center"><div class="spinner"></div></td></tr>';

      try {
        const resp = await API.get(url);
        const list = resp.invoices || resp.data || resp;
        invoicesData = Array.isArray(list) ? list : [];
        currentPage = page;

        renderInvoices();
        renderPagination(resp.total || resp.count || invoicesData.length, resp.pages);
      } catch (e) {
        console.error('Error loading invoices', e);
        tbody.innerHTML = '<tr><td colspan="7" class="text-center" style="color:#999">Error al cargar facturas.</td></tr>';
      }
    }

    function renderInvoices() {
      const tbody = document.getElementById('invoices-body');
      if (!invoicesData || invoicesData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center" style="color:#999">No hay facturas. <a href="new-invoice.html">Crear primera factura</a></td></tr>';
        return;
      }
      tbody.innerHTML = invoicesData.map(inv => {
        const invId = APP.esc(inv.id);
        const invNum = APP.esc(inv.invoice_number || inv.number || '');
        const customer = APP.esc(inv.customer_name || inv.customer || '-');
        const date = inv.date || inv.issue_date || '-';
        const dueDate = inv.due_date || inv.vencimiento || '-';
        const total = APP.formatMoney(inv.total);
        const statusClass = APP.getStatusClass(inv.status);
        const statusLabel = APP.getStatusLabel(inv.status);
        return '<tr>' +
          '<td><a href="invoices.html?id=' + invId + '">' + invNum + '</a></td>' +
          '<td>' + customer + '</td>' +
          '<td>' + date + '</td>' +
          '<td>' + dueDate + '</td>' +
          '<td>' + total + '</td>' +
          '<td><span class="status ' + statusClass + '">' + statusLabel + '</span></td>' +
          '<td>' +
            '<button class="btn-secondary" style="min-width:auto;font-size:.85em" onclick="showInvoiceDetail(\'' + invId + '\')" data-i18n="btn_view">Ver</button> ' +
            '<button class="btn-secondary" style="min-width:auto;font-size:.85em" onclick="downloadPdf(\'' + invId + '\')" data-i18n="btn_download_pdf">PDF</button> ' +
            '<button class="btn-secondary" style="min-width:auto;font-size:.85em;color:#dc3545" onclick="deleteInvoice(\'' + invId + '\')" data-i18n="btn_delete">Eliminar</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    function renderPagination(total, pages) {
      const container = document.getElementById('pagination');
      if (!total || total <= 20) {
        container.innerHTML = '';
        return;
      }
      const p = pages || Math.ceil(total / 20);
      let html = '<button onclick="loadInvoices(1)"' + (currentPage === 1 ? ' disabled' : '') + '>&laquo;</button>';
      for (let i = 1; i <= p; i++) {
        html += '<button onclick="loadInvoices(' + i + ')"' + (i === currentPage ? ' style="font-weight:bold;background:#555;color:#fff"' : '') + '>' + i + '</button>';
      }
      html += '<button onclick="loadInvoices(' + p + ')"' + (currentPage === p ? ' disabled' : '') + '>&raquo;</button>';
      container.innerHTML = html;
    }

    function applyFilters() {
      currentPage = 1;
      loadInvoices(1);
    }

    function showInvoiceDetail(id) {
      if (!id) return;
      loadInvoiceDetail(id);
    }

    async function loadInvoiceDetail(id) {
      try {
        const inv = await API.get('/api/invoices/' + id);
        const data = inv.invoice || inv;
        const total = APP.formatMoney(data.total);
        const subtotal = APP.formatMoney(data.subtotal || data.total);
        const tax = APP.formatMoney(data.tax || 0);
        const discount = APP.formatMoney(data.discount || 0);
        const paid = APP.formatMoney(data.paid || 0);
        const due = APP.formatMoney(data.due || (data.total - (data.paid || 0)));
        const statusClass = APP.getStatusClass(data.status);
        const statusLabel = APP.getStatusLabel(data.status);
        const items = data.items || [];

        let itemsHtml = '';
        if (items.length > 0) {
          itemsHtml = '<table class="items-table" style="margin:.5em 0"><thead><tr><th data-i18n="th_description">Descripción</th><th data-i18n="th_qty">Cant</th><th data-i18n="th_price">Precio</th><th data-i18n="th_total">Total</th></tr></thead><tbody>' +
            items.map(item => '<tr><td>' + APP.esc(item.description || item.name || '') + '</td><td>' + APP.esc(item.quantity || 1) + '</td><td>' + APP.formatMoney(item.price || 0) + '</td><td>' + APP.formatMoney((item.price || 0) * (item.quantity || 1)) + '</td></tr>').join('') +
          '</tbody></table>';
        }

        const html =
          '<div class="modal-content">' +
            '<button class="modal-close" onclick="this.closest(\'div[style]\').remove()">&times;</button>' +
            '<h2>' + APP.t('lbl_invoice') + ' ' + APP.esc(data.invoice_number || data.number || id) + '</h2>' +
            '<div style="margin-bottom:1em">' +
              '<p><strong data-i18n="th_customer">Cliente:</strong> ' + APP.esc(data.customer_name || data.customer || '-') + '</p>' +
              '<p><strong data-i18n="th_date">Fecha:</strong> ' + (data.date || data.issue_date || '-') + '</p>' +
              '<p><strong data-i18n="th_due_date">Vencimiento:</strong> ' + (data.due_date || '-') + '</p>' +
              '<p><strong data-i18n="th_status">Estado:</strong> <span class="status ' + statusClass + '">' + statusLabel + '</span></p>' +
            '</div>' +
            itemsHtml +
            '<div class="totals">' +
              '<div class="total-row"><span data-i18n="lbl_subtotal">Subtotal:</span> ' + subtotal + '</div>' +
              (data.discount ? '<div class="total-row"><span data-i18n="lbl_discount">Descuento:</span> ' + discount + '</div>' : '') +
              (data.tax ? '<div class="total-row"><span data-i18n="lbl_tax">Impuesto:</span> ' + tax + '</div>' : '') +
              '<div class="total-row grand"><span data-i18n="lbl_total">Total:</span> ' + total + '</div>' +
              (data.paid ? '<div class="total-row"><span data-i18n="lbl_paid">Pagado:</span> ' + paid + '</div>' : '') +
              (data.due ? '<div class="total-row" style="color:#dc3545"><span data-i18n="lbl_due">Pendiente:</span> ' + due + '</div>' : '') +
            '</div>' +
            '<div class="modal-footer">' +
              '<button onclick="window.location.href=\'new-invoice.html?id=' + APP.esc(id) + '\'" data-i18n="btn_edit">Editar</button> ' +
              '<button onclick="downloadPdf(\'' + APP.esc(id) + '\')" class="btn-secondary" data-i18n="btn_download_pdf">Descargar PDF</button>' +
            '</div>' +
          '</div>';

        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:60;display:flex;align-items:center;justify-content:center;overflow-y:auto';
        overlay.innerHTML = html;
        document.body.appendChild(overlay);
      } catch (e) {
        console.error('Error loading invoice detail', e);
        APP.showMessage('Error al cargar detalle de la factura', 'error');
      }
    }

    function downloadPdf(id) {
      window.open('/api/invoices/' + id + '/pdf', '_blank');
    }

    function deleteInvoice(id) {
      APP.confirm('Eliminar Factura', '¿Estás seguro de eliminar esta factura? Esta acción no se puede deshacer.', async () => {
        try {
          const resp = await API.del('/api/invoices/' + id);
          if (resp.error) {
            APP.showMessage(resp.error, 'error');
          } else {
            APP.showMessage('Factura eliminada correctamente', 'success');
            loadInvoices(currentPage);
          }
        } catch (e) {
          APP.showMessage('Error al eliminar la factura', 'error');
        }
      });
    }
</script>
</body>
</html>
