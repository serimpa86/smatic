<!DOCTYPE html> <html lang="es"> <head>   <meta charset="utf-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title data-i18n="page_title_credit_notes">Notas de Crédito | Smatic</title>   <link rel="stylesheet" href="css/main.css">   <style>     .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 60; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 2em 0; }     .modal-content { background: #fff; margin: auto; padding: 2em; border-radius: 8px; max-width: 700px; width: 95%; box-shadow: 0 4px 20px rgba(0,0,0,0.2); position: relative; }     .modal-close { position: absolute; top: .8em; right: 1em; font-size: 1.5em; cursor: pointer; color: #999; background: none; border: none; }     .modal-close:hover { color: #333; }     .modal-footer { display: flex; gap: .5em; justify-content: flex-end; margin-top: 1.5em; }     .invoice-form { background: #fff; padding: 1.5em; border: 1px solid #e0e0e0; }     .invoice-form .form-row { display: flex; gap: 1em; margin-bottom: .75em; flex-wrap: wrap; }     .invoice-form .form-row > * { flex: 1; min-width: 14em; }     .invoice-form label { display: block; font-size: .85em; color: #666; margin-bottom: .25em; font-weight: 600; }     .invoice-form input, .invoice-form textarea, .invoice-form select { width: 100%; }     .invoice-form textarea { min-height: 4em; resize: vertical; }     .items-table { width: 100%; border-collapse: collapse; margin: .5em 0; }     .items-table th { background: #555; color: #fff; padding: .5em .4em; text-align: left; font-weight: bold; font-size: .85em; }     .items-table td { padding: .3em; border-bottom: 1px solid #eee; }     .items-table td input, .items-table td select { width: 100%; border: 1px solid #dadada; padding: .35em; }     .nav-tabs { display: flex; gap: 0; margin-bottom: 1.5em; border-bottom: 2px solid #ccc; }     .nav-tabs a { padding: .6em 1.2em; text-decoration: none; color: #555; font-weight: 600; font-size: .9em; border-radius: 6px 6px 0 0; }     .nav-tabs a.active { background: #555; color: #fff; }     .nav-tabs a:hover:not(.active) { background: #f5f5f5; }     .badge { display: inline-block; padding: .2em .6em; border-radius: 10px; font-size: .78em; font-weight: 600; }     .badge-open { background: #fff3cd; color: #856404; }     .badge-closed { background: #d4edda; color: #155724; }     .badge-partial { background: #cce5ff; color: #004085; }   </style> </head> <body>   <div class="navigation-wrapper" id="sidebar">
  <nav id="app-nav" class="navigation"></nav>
</div>    <div class="header-wrapper">     <div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">☰</div>     <div class="breadcrumbs">       <img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'">       <span data-i18n="breadcrumb_credit_notes">Smatic - Notas de Crédito</span>     </div>   </div>    <div class="container" id="main-content">     <div class="page-header">       <h1 data-i18n="page_title_credit_notes">Notas de Crédito</h1>       <div class="actions">         <button onclick="showCreateModal()">+ <span data-i18n="btn_new_credit_note">Nueva Nota</span></button>       </div>     </div>      <div class="filters">       <select id="filter-status">         <option value="" data-i18n="filter_all_statuses">Todos los estados</option>         <option value="open" data-i18n="status_open">Abierta</option>         <option value="partial" data-i18n="status_partial">Parcial</option>         <option value="closed" data-i18n="status_closed">Cerrada</option>       </select>       <div class="search-box">         <input type="text" id="filter-search" data-i18n-placeholder="placeholder_search_credit_notes" placeholder="Buscar por número o cliente...">         <button onclick="applyFilters()" data-i18n="btn_search">Buscar</button>       </div>     </div>      <div class="card">       <div class="scroll-table">         <table class="record-list" id="notes-table">           <thead>             <tr>               <th data-i18n="th_credit_note_number">N° Nota</th>               <th data-i18n="th_customer">Cliente</th>               <th data-i18n="th_invoice">Factura</th>               <th data-i18n="th_date">Fecha</th>               <th data-i18n="th_total">Total</th>               <th data-i18n="th_applied">Aplicado</th>               <th data-i18n="th_status">Estado</th>               <th data-i18n="th_reason">Razón</th>               <th data-i18n="th_actions">Acciones</th>             </tr>           </thead>           <tbody id="notes-body">             <tr><td colspan="9" class="text-center" style="color:#999" data-i18n="loading">Cargando...</td></tr>           </tbody>         </table>       </div>     </div>      <div id="pagination" class="pagination"></div>   </div>    <div id="infobar"></div>    <script src="js/api.js"></script>   <script src="js/config.js"></script>   <script src="js/app.js"></script>   <script>     let notes = [];     let invoices = [];     let customers = [];      document.addEventListener('DOMContentLoaded', async () => {       if (!API.isAuthenticated()) { window.location.href = '/login.html'; return; }       await APP.init(); loadNotes();     });      document.addEventListener('click', (e) => {       const sidebar = document.getElementById('sidebar');       if (window.innerWidth <= 768 && sidebar.style.display === 'block' && !sidebar.contains(e.target) && !e.target.closest('.hamburger')) {         sidebar.style.display = '';       }     });      document.getElementById('filter-search').addEventListener('keydown', (e) => {       if (e.key === 'Enter') applyFilters();     });      async function loadNotes() {       try {         const status = document.getElementById('filter-status').value;         const search = document.getElementById('filter-search').value;         let url = '/api/credit-notes';         const params = [];         if (status) params.push('status=' + encodeURIComponent(status));         if (search) params.push('search=' + encodeURIComponent(search));         if (params.length) url += '?' + params.join('&');         const data = await API.get(url);         notes = data.notes || [];         renderNotes();       } catch (e) { console.error(e); }     }      function applyFilters() { loadNotes(); }      function badgeClass(status) {       if (status === 'open') return 'badge-open';       if (status === 'partial') return 'badge-partial';       if (status === 'closed') return 'badge-closed';       return '';     }      function statusText(status) {       if (status === 'open') return 'Abierta';       if (status === 'partial') return 'Parcial';       if (status === 'closed') return 'Cerrada';       return status;     }      function renderNotes() {       const tbody = document.getElementById('notes-body');       if (!notes.length) {         tbody.innerHTML = '<tr><td colspan="9" class="text-center" style="color:#999">Sin notas de crédito</td></tr>';         return;       }       tbody.innerHTML = notes.map(n => `         <tr>           <td>${APP.esc(n.credit_note_number)}</td>           <td>${APP.esc(n.customer_name || '—')}</td>           <td>${n.invoice_id ? '<a href="#" onclick="showInvoice(\'' + n.invoice_id + '\');return false">Ver</a>' : '—'}</td>           <td>${n.date || '—'}</td>           <td>${APP.formatMoney(n.total || 0)}</td>           <td>${APP.formatMoney(n.amount_applied || 0)}</td>           <td><span class="badge ${badgeClass(n.status)}">${statusText(n.status)}</span></td>           <td>${APP.esc((n.reason || '').substring(0, 40))}</td>           <td>             <button class="btn-sm btn-outline" onclick="viewNote('${n.id}')" data-i18n="btn_view">Ver</button>             ${n.status === 'open' ? '<button class="btn-sm btn-outline" onclick="showApplyModal(\'' + n.id + '\')" data-i18n="btn_apply">Aplicar</button>' : ''}             <button class="btn-sm btn-outline" onclick="deleteNote('${n.id}')" style="color:#dc3545;border-color:#dc3545" data-i18n="btn_delete">Eliminar</button>           </td>         </tr>       `).join('');     }      async function showCreateModal() {       try {         const [invData, custData] = await Promise.all([           API.get('/api/invoices'),           API.get('/api/customers')         ]);         invoices = (invData.invoices || []).filter(i => i.status === 'sent' || i.status === 'partial');         customers = custData.customers || [];       } catch (e) { console.error(e); }        const invOpts = invoices.map(i => `<option value="${i.id}">${APP.esc(i.invoice_number)} - ${APP.esc(i.customer_name)} (${APP.formatMoney(i.total)})</option>`).join('');       const html = `         <div class="invoice-form">           <div class="form-row">             <div><label data-i18n="lbl_related_invoice">Factura Relacionada</label><select id="cn-invoice" onchange="cnInvoiceChange()"><option value="">— <span data-i18n="option_without_invoice">Sin factura</span> —</option>${invOpts}</select></div>             <div><label data-i18n="lbl_customer">Cliente</label><select id="cn-customer"><option value="" data-i18n="option_select">Seleccionar...</option>${customers.map(c => '<option value="' + c.id + '">' + APP.esc(c.name) + '</option>').join('')}</select></div>           </div>           <div class="form-row">             <div><label data-i18n="lbl_date">Fecha</label><input type="date" id="cn-date" value="${new Date().toISOString().split('T')[0]}"></div>             <div><label data-i18n="lbl_reason">Razón</label><input id="cn-reason" data-i18n-placeholder="placeholder_credit_note_reason" placeholder="Motivo de la nota de crédito"></div>           </div>           <div class="form-section-title" data-i18n="section_items" style="margin-top:1em">Artículos</div>           <div class="scroll-table">             <table class="items-table">               <thead><tr><th data-i18n="th_qty">Cant</th><th data-i18n="th_description">Descripción</th><th data-i18n="th_price">Precio</th><th data-i18n="th_total">Total</th></tr></thead>               <tbody id="cn-items-body"><tr><td colspan="4" class="text-center" style="color:#999" data-i18n="msg_select_invoice_for_items">Seleccione una factura para cargar artículos</td></tr></tbody>             </table>           </div>           <div class="modal-footer" style="margin-top:1em">             <button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()" data-i18n="btn_cancel">Cancelar</button>             <button class="btn" onclick="saveCreditNote()" data-i18n="btn_save_note">Guardar Nota</button>           </div>         </div>`;       APP.modal(html, APP.t('modal_title_new_credit_note', 'Nueva Nota de Crédito'));       document.getElementById('cn-date').value = new Date().toISOString().split('T')[0];     }      window.cnInvoiceChange = function() {       const invId = document.getElementById('cn-invoice').value;       const tbody = document.getElementById('cn-items-body');       if (!invId) {         tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="color:#999" data-i18n="msg_select_invoice_for_items">Seleccione una factura para cargar artículos</td></tr>';         document.getElementById('cn-customer').value = '';         return;       }       const inv = invoices.find(i => i.id === invId);       if (inv) {         const cust = customers.find(c => c.id === inv.customer_id);         if (cust) document.getElementById('cn-customer').value = cust.id;       }       API.get('/api/invoices/' + invId).then(invDetail => {         const items = invDetail.items || [];         if (!items.length) {           tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="color:#999" data-i18n="msg_no_items_in_invoice">Sin artículos en esta factura</td></tr>';           return;         }         tbody.innerHTML = items.map(it => `           <tr>             <td><input type="number" class="cn-qty" value="${it.quantity}" min="0.01" step="0.01" style="width:5em" oninput="cnCalcTotal()"></td>             <td><input type="text" class="cn-desc" value="${APP.esc(it.description || '')}" style="width:100%"></td>             <td><input type="number" class="cn-price" value="${it.unit_price || 0}" step="0.01" style="width:8em" oninput="cnCalcTotal()"></td>             <td class="cn-line-total" style="text-align:right;font-weight:bold;padding-right:.5em">${APP.formatMoney((it.quantity||0) * (it.unit_price||0))}</td>           </tr>         `).join('');         cnCalcTotal();       }).catch(e => {         tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="color:#999" data-i18n="error_loading_items">Error al cargar artículos</td></tr>';       });     };      window.cnCalcTotal = function() {       const rows = document.querySelectorAll('#cn-items-body tr');       let total = 0;       rows.forEach(tr => {         const qty = parseFloat(tr.querySelector('.cn-qty').value) || 0;         const price = parseFloat(tr.querySelector('.cn-price').value) || 0;         const lineTotal = qty * price;         total += lineTotal;         tr.querySelector('.cn-line-total').textContent = APP.formatMoney(lineTotal);       });       return total;     };      window.saveCreditNote = async function() {       const invId = document.getElementById('cn-invoice').value;       const custId = document.getElementById('cn-customer').value;       const date = document.getElementById('cn-date').value;       const reason = document.getElementById('cn-reason').value.trim();       const cust = customers.find(c => c.id === custId);       const rows = document.querySelectorAll('#cn-items-body tr');       const items = [];       rows.forEach(tr => {         const qty = parseFloat(tr.querySelector('.cn-qty').value) || 0;         const price = parseFloat(tr.querySelector('.cn-price').value) || 0;         if (qty && price) {           items.push({ description: tr.querySelector('.cn-desc').value || '', quantity: qty, unit_price: price });         }       });       if (!items.length) { APP.showMessage('Agregue al menos un artículo', 'error'); return; }       if (!custId) { APP.showMessage('Seleccione un cliente', 'error'); return; }       try {         const result = await API.post('/api/credit-notes', {           invoice_id: invId || null,           customer_id: custId,           customer_name: cust ? cust.name : '',           customer_email: cust ? cust.email : '',           date,           reason,           items,           currency: 'USD',           currency_symbol: '$'         });         if (result.errorcode) { APP.showMessage(result.errormsg || 'Error al crear', 'error'); return; }         APP.showMessage('Nota de crédito creada: ' + result.credit_note_number, 'success');         document.querySelector('.modal-overlay')?.remove();         loadNotes();       } catch (e) { APP.showMessage('Error al crear nota de crédito', 'error'); }     };      window.viewNote = async function(id) {       try {         const note = await API.get('/api/credit-notes/' + id);         const items = note.items || [];         const itemsHtml = items.length ? items.map(it => `           <tr><td>${it.quantity}</td><td>${APP.esc(it.description)}</td><td class="text-right">${APP.formatMoney(it.unit_price)}</td><td class="text-right">${APP.formatMoney(it.total)}</td></tr>         `).join('') : '<tr><td colspan="4" class="text-center" data-i18n="msg_no_items">Sin artículos</td></tr>';         const html = `           <div style="min-width:400px">             <p><strong data-i18n="th_credit_note_number">Nota:</strong> ${APP.esc(note.credit_note_number)}</p>             <p><strong data-i18n="th_customer">Cliente:</strong> ${APP.esc(note.customer_name)}</p>             <p><strong data-i18n="lbl_date">Fecha:</strong> ${note.date}</p>             <p><strong data-i18n="th_status">Estado:</strong> ${statusText(note.status)}</p>             ${note.reason ? '<p><strong data-i18n="th_reason">Razón:</strong> ' + APP.esc(note.reason) + '</p>' : ''}             <table class="items-table"><thead><tr><th data-i18n="th_qty">Cant</th><th data-i18n="th_description">Descripción</th><th class="text-right" data-i18n="th_price">Precio</th><th class="text-right" data-i18n="th_total">Total</th></tr></thead><tbody>${itemsHtml}</tbody></table>             <div style="text-align:right;margin-top:.5em"><strong data-i18n="lbl_total">Total: ${APP.formatMoney(note.total)}</strong></div>             <div style="text-align:right"><strong data-i18n="lbl_applied">Aplicado: ${APP.formatMoney(note.amount_applied || 0)}</strong></div>             <div class="modal-footer"><button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()" data-i18n="btn_close">Cerrar</button></div>           </div>`;         APP.modal(html, 'Nota de Crédito #' + note.credit_note_number);       } catch (e) { APP.showMessage('Error al cargar nota', 'error'); }     };      window.showApplyModal = function(id) {       const note = notes.find(n => n.id === id);       if (!note) return;       const available = (note.total || 0) - (note.amount_applied || 0);       const invOpts = invoices.filter(i => i.status === 'sent' || i.status === 'partial').map(i =>         `<option value="${i.id}">${APP.esc(i.invoice_number)} - ${APP.esc(i.customer_name)} (adeuda: ${APP.formatMoney(i.amount_due || i.total)})</option>`       ).join('');       const html = `         <div>           <p><span data-i18n="lbl_credit_note">Nota:</span> <strong>${APP.esc(note.credit_note_number)}</strong> — <span data-i18n="lbl_available">Disponible:</span> ${APP.formatMoney(available)}</p>           <div class="form-row"><div><label data-i18n="lbl_invoice">Factura</label><select id="apply-invoice">${invOpts}</select></div></div>           <div class="form-row"><div><label data-i18n="lbl_amount_to_apply">Monto a Aplicar</label><input type="number" id="apply-amount" value="${available}" step="0.01" min="0" max="${available}"></div></div>           <div class="modal-footer">             <button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()" data-i18n="btn_cancel">Cancelar</button>             <button class="btn" onclick="applyCreditNote('${id}')" data-i18n="btn_apply">Aplicar</button>           </div>         </div>`;       APP.modal(html, APP.t('modal_title_apply_credit_note', 'Aplicar Nota de Crédito'));     };      window.applyCreditNote = async function(id) {       const invId = document.getElementById('apply-invoice').value;       const amount = parseFloat(document.getElementById('apply-amount').value) || 0;       if (!invId || !amount) { APP.showMessage('Seleccione factura y monto', 'error'); return; }       try {         const result = await API.post('/api/credit-notes/' + id + '/apply', { invoice_id: invId, amount });         if (result.errorcode) { APP.showMessage(result.errormsg || 'Error', 'error'); return; }         APP.showMessage('Nota aplicada exitosamente', 'success');         document.querySelector('.modal-overlay')?.remove();         loadNotes();       } catch (e) { APP.showMessage('Error al aplicar nota', 'error'); }     };      window.deleteNote = async function(id) {       if (!confirm('¿Eliminar esta nota de crédito?')) return;       try {         await API.del('/api/credit-notes/' + id);         APP.showMessage('Nota eliminada', 'success');         loadNotes();       } catch (e) { APP.showMessage('Error al eliminar', 'error'); }     };      window.showInvoice = function(id) {       window.open('invoices.html?id=' + id, '_blank');     }; </script> </body> </html>
