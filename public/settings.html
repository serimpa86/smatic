<!DOCTYPE html> <html lang="es"> <head>   <meta charset="utf-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title data-i18n="page_title_settings">Configuración | Smatic</title>   <link rel="stylesheet" href="css/main.css"> </head> <body>   <div class="navigation-wrapper" id="sidebar">
  <nav id="app-nav" class="navigation"></nav>
</div>    <div class="header-wrapper">     <div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">☰</div>     <div class="breadcrumbs">       <img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'">       <span data-i18n="breadcrumb_settings">Smatic - Configuración</span>     </div>   </div>    <div class="container" id="main-content">     <div class="page-header">       <h1 data-i18n="page_title_settings">Configuración</h1>       <div class="actions">         <button onclick="saveSettings()" data-i18n="btn_save_changes">Guardar Cambios</button>       </div>     </div>      <div class="filters">       <button class="btn-secondary tab-btn" data-tab="business" onclick="switchTab('business')" style="min-width:auto" data-i18n="tab_business">Empresa</button>       <button class="btn-secondary tab-btn" data-tab="taxes" onclick="switchTab('taxes')" style="min-width:auto" data-i18n="tab_taxes">Impuestos</button>       <button class="btn-secondary tab-btn" data-tab="preferences" onclick="switchTab('preferences')" style="min-width:auto" data-i18n="tab_preferences">Preferencias</button>     </div>      <div id="tab-business" class="tab-content">       <div class="card">         <div class="card-header" data-i18n="card_business_info">Información de la Empresa</div>         <div class="settings-grid">           <div>             <label data-i18n="lbl_business_name">Nombre de la Empresa</label>             <input type="text" id="fieldBusinessName">           </div>           <div>             <label data-i18n="lbl_address">Dirección</label>             <textarea id="fieldBusinessAddress" rows="2"></textarea>           </div>           <div>             <label data-i18n="lbl_phone">Teléfono</label>             <input type="text" id="fieldBusinessPhone">           </div>           <div>             <label data-i18n="lbl_email">Email</label>             <input type="email" id="fieldBusinessEmail">           </div>           <div>             <label data-i18n="lbl_website">Sitio Web</label>             <input type="url" id="fieldWebsite">           </div>           <div>             <label data-i18n="lbl_currency">Moneda</label>             <select id="fieldCurrency">               <option value="USD">USD - Dólar</option>               <option value="EUR">EUR - Euro</option>               <option value="MXN">MXN - Peso Mexicano</option>               <option value="COP">COP - Peso Colombiano</option>               <option value="ARS">ARS - Peso Argentino</option>             </select>           </div>           <div>             <label data-i18n="lbl_language">Idioma</label>             <select id="fieldLanguage">               <option value="es">Español</option>               <option value="en">English</option>             </select>           </div>           <div>             <label data-i18n="lbl_timezone">Zona Horaria</label>             <input type="text" id="fieldTimezone" data-i18n-placeholder="placeholder_timezone" placeholder="ej: America/Mexico_City">           </div>           <div>             <label data-i18n="lbl_logo">Logo</label>             <input type="file" id="fieldLogo" accept="image/*">             <div id="logoPreview" style="margin-top:.5em"></div>           </div>         </div>       </div>     </div>      <div id="tab-taxes" class="tab-content" style="display:none">       <div class="card">         <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">           <span data-i18n="tab_taxes">Impuestos</span>           <button class="btn-secondary" style="min-width:auto" onclick="openTaxModal()" data-i18n="btn_add_tax">+ Agregar Impuesto</button>         </div>         <div class="scroll-table">           <table class="record-list" id="taxes-table">             <thead>               <tr>                 <th data-i18n="th_name">Nombre</th>                 <th data-i18n="th_rate">Tasa</th>                 <th data-i18n="th_compound">Compuesto</th>                 <th data-i18n="th_default">Por Defecto</th>                 <th data-i18n="th_actions">Acciones</th>               </tr>             </thead>             <tbody id="taxes-body">               <tr><td colspan="5" class="text-center loading" data-i18n="loading">Cargando...</td></tr>             </tbody>           </table>         </div>       </div>     </div>      <div id="tab-preferences" class="tab-content" style="display:none">       <div class="card">         <div class="card-header" data-i18n="card_user_preferences">Preferencias de Usuario</div>         <div class="settings-grid">           <div>             <label data-i18n="lbl_interface_language">Idioma de la interfaz</label>             <select id="fieldUserLanguage">               <option value="es">Español</option>               <option value="en">English</option>               <option value="fr">Français</option>             </select>           </div>         </div>       </div>       <div class="card">         <div class="card-header" data-i18n="card_system_preferences">Preferencias del Sistema</div>         <div class="settings-grid">           <div>             <label data-i18n="lbl_invoice_prefix">Prefijo de Facturas</label>             <input type="text" id="fieldInvoicePrefix" data-i18n-placeholder="placeholder_invoice_prefix" placeholder="ej: INV-">           </div>           <div>             <label data-i18n="lbl_quote_prefix">Prefijo de Cotizaciones</label>             <input type="text" id="fieldQuotePrefix" data-i18n-placeholder="placeholder_quote_prefix" placeholder="ej: COT-">           </div>           <div>             <label data-i18n="lbl_credit_note_prefix">Prefijo de Notas de Crédito</label>             <input type="text" id="fieldCreditNotePrefix" data-i18n-placeholder="placeholder_credit_note_prefix" placeholder="ej: CN-">           </div>           <div>             <label data-i18n="lbl_payment_terms">Términos de Pago (días)</label>             <select id="fieldPaymentTerms">               <option value="0" data-i18n="payment_term_cash">Contado</option>               <option value="15" data-i18n="payment_term_15_days">15 Días</option>               <option value="30" data-i18n="payment_term_30_days">30 Días</option>               <option value="60" data-i18n="payment_term_60_days">60 Días</option>               <option value="90" data-i18n="payment_term_90_days">90 Días</option>             </select>           </div>           <div>             <label data-i18n="lbl_fiscal_year_start">Inicio del Año Fiscal</label>             <input type="text" id="fieldFiscalYearStart" data-i18n-placeholder="placeholder_fiscal_year_start" placeholder="ej: 01-01">           </div>         </div>       </div>     </div>      <div style="text-align:right;margin-top:1em">       <button onclick="saveSettings()" data-i18n="btn_save_changes">Guardar Cambios</button>     </div>   </div>    <div id="taxModal" class="modal-overlay" style="display:none">     <div class="modal-content">       <button class="modal-close" onclick="closeTaxModal()">&times;</button>       <h2 id="taxModalTitle" data-i18n="modal_title_add_tax">Agregar Impuesto</h2>       <form id="taxForm" onsubmit="saveTax(event)">         <input type="hidden" id="taxId">         <div class="invoice-form">           <div class="form-row">             <div>               <label data-i18n="lbl_name_required">Nombre *</label>               <input type="text" id="fieldTaxName" required>             </div>             <div>               <label data-i18n="lbl_rate_required">Tasa (%) *</label>               <input type="number" id="fieldTaxRate" step="0.01" min="0" max="100" required>             </div>           </div>           <div class="form-row">             <div>               <label>                 <input type="checkbox" id="fieldTaxCompound">                 <span data-i18n="lbl_compound_tax">Impuesto compuesto</span>               </label>             </div>             <div>               <label>                 <input type="checkbox" id="fieldTaxDefault">                 <span data-i18n="lbl_default_tax">Por defecto</span>               </label>             </div>           </div>         </div>         <div class="modal-footer">           <button type="button" class="btn-secondary" onclick="closeTaxModal()" data-i18n="btn_cancel">Cancelar</button>           <button type="submit" data-i18n="btn_save">Guardar</button>         </div>       </form>     </div>   </div>    <div id="infobar"></div>    <script src="js/api.js"></script>   <script src="js/config.js"></script>   <script src="js/app.js"></script>   <script>     let settingsData = {};     let allTaxes = [];      document.addEventListener('DOMContentLoaded', async () => {       if (!API.isAuthenticated()) { window.location.href = '/login.html'; return; }       await APP.init(); await loadSettings();       await loadUserPreferences();       await loadTaxes();       highlightTab('business');     });      document.addEventListener('click', (e) => {       const sidebar = document.getElementById('sidebar');       if (window.innerWidth <= 768 && sidebar.style.display === 'block' && !sidebar.contains(e.target) && !e.target.closest('.hamburger')) {         sidebar.style.display = '';       }     });      document.getElementById('fieldLogo').addEventListener('change', async (e) => {       const file = e.target.files[0];       if (!file) return;       const formData = new FormData();       formData.append('logo', file);       try {         const resp = await fetch('/api/settings/logo', {           method: 'POST',           headers: { 'Authorization': 'Bearer ' + API._token },           body: formData         });         const result = await resp.json();         if (result.url || result.logo_url) {           document.getElementById('logoPreview').innerHTML = '<img src="' + APP.esc(result.url || result.logo_url) + '" style="max-width:150px;max-height:60px">';           APP.showMessage('Logo actualizado correctamente', 'success');         } else {           APP.showMessage('Error al subir el logo', 'error');         }       } catch (e) {         APP.showMessage('Error al subir el logo', 'error');         console.error(e);       }     });      function switchTab(tab) {       document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');       document.getElementById('tab-' + tab).style.display = 'block';       highlightTab(tab);     }      function highlightTab(tab) {       document.querySelectorAll('.tab-btn').forEach(btn => {         btn.style.background = btn.dataset.tab === tab ? '#555' : '';         btn.style.color = btn.dataset.tab === tab ? '#fff' : '';       });     }      async function loadSettings() {       try {         settingsData = await API.get('/api/settings');         document.getElementById('fieldBusinessName').value = settingsData.business_name || '';         document.getElementById('fieldBusinessAddress').value = settingsData.business_address || '';         document.getElementById('fieldBusinessPhone').value = settingsData.business_phone || '';         document.getElementById('fieldBusinessEmail').value = settingsData.business_email || '';         document.getElementById('fieldWebsite').value = settingsData.website || '';         document.getElementById('fieldCurrency').value = settingsData.currency || 'USD';         document.getElementById('fieldLanguage').value = settingsData.language || 'es';         document.getElementById('fieldTimezone').value = settingsData.timezone || '';         document.getElementById('fieldInvoicePrefix').value = settingsData.invoice_prefix || '';         document.getElementById('fieldQuotePrefix').value = settingsData.quote_prefix || '';         document.getElementById('fieldCreditNotePrefix').value = settingsData.credit_note_prefix || '';         document.getElementById('fieldPaymentTerms').value = settingsData.payment_terms || '30';         document.getElementById('fieldFiscalYearStart').value = settingsData.fiscal_year_start || '';         if (settingsData.logo_url) {           document.getElementById('logoPreview').innerHTML = '<img src="' + APP.esc(settingsData.logo_url) + '" style="max-width:150px;max-height:60px">';         }       } catch (e) {         console.error('Error loading settings', e);       }     }      async function loadUserPreferences() {       const user = APP.currentUser || await API.get('/api/user');       if (user && user.language) {         document.getElementById('fieldUserLanguage').value = user.language;       }     }      async function saveUserPreferences() {       const language = document.getElementById('fieldUserLanguage').value;       try {         await API.put('/api/user/preferences', { language });         localStorage.setItem('lang', language);         APP.currentUser.language = language;         await APP.loadLang();         APP.applyLanguage();       } catch (e) {         console.error('Error saving user preferences', e);       }     }      async function saveSettings() {       const data = {         business_name: document.getElementById('fieldBusinessName').value.trim(),         business_address: document.getElementById('fieldBusinessAddress').value.trim(),         business_phone: document.getElementById('fieldBusinessPhone').value.trim(),         business_email: document.getElementById('fieldBusinessEmail').value.trim(),         website: document.getElementById('fieldWebsite').value.trim(),         currency: document.getElementById('fieldCurrency').value,         language: document.getElementById('fieldLanguage').value,         timezone: document.getElementById('fieldTimezone').value.trim(),         invoice_prefix: document.getElementById('fieldInvoicePrefix').value.trim(),         quote_prefix: document.getElementById('fieldQuotePrefix').value.trim(),         credit_note_prefix: document.getElementById('fieldCreditNotePrefix').value.trim(),         payment_terms: document.getElementById('fieldPaymentTerms').value,         fiscal_year_start: document.getElementById('fieldFiscalYearStart').value.trim()       };       try {         await API.put('/api/settings', data);         await saveUserPreferences();         APP.showMessage('Configuración guardada correctamente', 'success');         APP.settings = data;       } catch (e) {         APP.showMessage('Error al guardar la configuración', 'error');         console.error(e);       }     }      async function loadTaxes() {       try {         const resp = await API.get('/api/settings/taxes');         allTaxes = resp.taxes || resp.data || (Array.isArray(resp) ? resp : []);         renderTaxes();       } catch (e) {         console.error('Error loading taxes', e);         document.getElementById('taxes-body').innerHTML = '<tr><td colspan="5" class="text-center" style="color:#999">Error al cargar impuestos</td></tr>';       }     }      function renderTaxes() {       const tbody = document.getElementById('taxes-body');       if (!allTaxes.length) {         tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="color:#999">No hay impuestos configurados</td></tr>';         return;       }       tbody.innerHTML = allTaxes.map(t => {         return '<tr>' +           '<td>' + APP.esc(t.name) + '</td>' +           '<td>' + (t.rate || 0) + '%</td>' +           '<td>' + (t.is_compound ? 'Sí' : 'No') + '</td>' +           '<td>' + (t.is_default ? 'Sí' : 'No') + '</td>' +           '<td>' +             '<button class="btn-secondary" style="min-width:auto;font-size:.85em" onclick="openTaxEdit(\'' + t.id + '\')" data-i18n="btn_edit">Editar</button> ' +             '<button class="btn-danger" style="min-width:auto;font-size:.85em" onclick="deleteTax(\'' + t.id + '\',\'' + APP.esc(t.name).replace(/'/g, "\\'") + '\')" data-i18n="btn_delete">Eliminar</button>' +           '</td>' +         '</tr>';       }).join('');     }      function openTaxModal() {       document.getElementById('taxModalTitle').textContent = 'Agregar Impuesto';       document.getElementById('taxId').value = '';       document.getElementById('taxForm').reset();       document.getElementById('fieldTaxCompound').checked = false;       document.getElementById('fieldTaxDefault').checked = false;       document.getElementById('taxModal').style.display = 'flex';     }      function openTaxEdit(id) {       const tax = allTaxes.find(t => t.id === id);       if (!tax) return;       document.getElementById('taxModalTitle').textContent = 'Editar Impuesto';       document.getElementById('taxId').value = tax.id;       document.getElementById('fieldTaxName').value = tax.name || '';       document.getElementById('fieldTaxRate').value = tax.rate || '';       document.getElementById('fieldTaxCompound').checked = !!tax.is_compound;       document.getElementById('fieldTaxDefault').checked = !!tax.is_default;       document.getElementById('taxModal').style.display = 'flex';     }      function closeTaxModal() {       document.getElementById('taxModal').style.display = 'none';     }      async function saveTax(e) {       e.preventDefault();       const id = document.getElementById('taxId').value;       const name = document.getElementById('fieldTaxName').value.trim();       const rate = parseFloat(document.getElementById('fieldTaxRate').value) || 0;       const is_compound = document.getElementById('fieldTaxCompound').checked;       const is_default = document.getElementById('fieldTaxDefault').checked;       if (!name) { APP.showMessage('El nombre del impuesto es obligatorio', 'error'); return; }       const data = { name, rate, is_compound, is_default };       try {         if (id) {           await API.put('/api/settings/taxes/' + id, data);           APP.showMessage('Impuesto actualizado correctamente', 'success');         } else {           await API.post('/api/settings/taxes', data);           APP.showMessage('Impuesto creado correctamente', 'success');         }         closeTaxModal();         await loadTaxes();       } catch (e) {         APP.showMessage('Error al guardar el impuesto', 'error');         console.error(e);       }     }      function deleteTax(id, name) {       APP.confirm('Eliminar Impuesto', '¿Estás seguro de eliminar el impuesto "' + name + '"? Esta acción no se puede deshacer.', async () => {         try {           await API.del('/api/settings/taxes/' + id);           APP.showMessage('Impuesto eliminado correctamente', 'success');           await loadTaxes();         } catch (e) {           APP.showMessage('Error al eliminar el impuesto', 'error');           console.error(e);         }       });     } </script> </body> </html>
