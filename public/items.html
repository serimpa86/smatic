<!DOCTYPE html> <html lang="es"> <head>   <meta charset="utf-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title data-i18n="page_title_items">Productos | Smatic</title>   <link rel="stylesheet" href="css/main.css"> </head> <body>   <div class="navigation-wrapper" id="sidebar">
  <nav id="app-nav" class="navigation"></nav>
</div>    <div class="header-wrapper">     <div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">☰</div>     <div class="breadcrumbs">       <img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'">       <span data-i18n="breadcrumb_items">Smatic - Productos</span>     </div>   </div>    <div class="container" id="main-content">     <div class="page-header">       <h1 data-i18n="page_title_items">Productos</h1>       <div class="actions">         <button onclick="openAddModal()">+ <span data-i18n="btn_new_item">Nuevo Producto</span></button>       </div>     </div>      <div class="filters">       <div class="search-box">         <input type="text" id="searchInput" data-i18n-placeholder="placeholder_search_items" placeholder="Buscar productos..." oninput="filterItems()">       </div>     </div>      <div class="card">       <div class="scroll-table">         <table class="record-list" id="items-table">           <thead>             <tr>               <th data-i18n="th_photo">Foto</th>               <th data-i18n="th_code">Código</th>               <th data-i18n="th_name">Nombre</th>               <th data-i18n="th_price">Precio</th>               <th data-i18n="th_tax">Impuesto</th>               <th data-i18n="th_stock">Stock</th>               <th data-i18n="th_active">Activo</th>               <th data-i18n="th_actions">Acciones</th>             </tr>           </thead>           <tbody id="items-body">             <tr><td colspan="8" class="text-center loading" data-i18n="loading">Cargando...</td></tr>           </tbody>         </table>       </div>     </div>   </div>    <div id="itemModal" class="modal-overlay" style="display:none">     <div class="modal-content">       <button class="modal-close" onclick="closeModal()">&times;</button>       <h2 id="modalTitle" data-i18n="modal_title_new_item">Nuevo Producto</h2>       <form id="itemForm" onsubmit="saveItem(event)">         <input type="hidden" id="itemId">         <div class="invoice-form">           <div class="form-row">             <div>               <label data-i18n="lbl_code_required">Código *</label>               <input type="text" id="fieldCode" required>             </div>             <div>               <label data-i18n="lbl_name_required">Nombre *</label>               <input type="text" id="fieldName" required>             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_description">Descripción</label>               <textarea id="fieldDescription" rows="2"></textarea>             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_price_required">Precio *</label>               <input type="number" id="fieldPrice" step="0.01" min="0" required>             </div>             <div>               <label data-i18n="lbl_cost">Costo</label>               <input type="number" id="fieldCostPrice" step="0.01" min="0">             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_tax">Impuesto</label>               <select id="fieldTaxRate">                 <option value="" data-i18n="option_no_tax">Sin impuesto</option>               </select>             </div>             <div>               <label data-i18n="lbl_unit">Unidad</label>               <input type="text" id="fieldUnit" data-i18n-placeholder="placeholder_unit_example" placeholder="ej: pieza, kg, hora">             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_stock_quantity">Cantidad en Stock</label>               <input type="number" id="fieldStockQuantity" step="1" min="0" value="0">             </div>             <div>               <label data-i18n="lbl_stock_alert">Nivel de Alerta</label>               <input type="number" id="fieldStockWarning" step="1" min="0" value="0">             </div>           </div>           <div class="form-row">             <div>               <label>                 <input type="checkbox" id="fieldTrackInventory" checked>                 <span data-i18n="lbl_track_inventory">Controlar inventario</span>               </label>             </div>             <div>               <label>                 <input type="checkbox" id="fieldActive" checked>                 <span data-i18n="lbl_active">Activo</span>               </label>             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_product_photo">Foto del Producto</label>               <input type="file" id="fieldImage" accept="image/*" onchange="previewImage(event)">               <div id="imagePreview" style="margin-top:5px;max-width:150px"></div>             </div>             <div>               <label data-i18n="lbl_qr_code">Código QR</label>               <div id="qrPreview" style="margin-top:5px;min-height:80px">                 <span style="color:#999;font-size:.85em" data-i18n="msg_qr_auto_generated">Se genera automáticamente con el código</span>               </div>               <button type="button" class="btn-secondary" style="font-size:.8em;margin-top:3px" onclick="regenerateQr()" data-i18n="btn_regenerate_qr">Regenerar QR</button>             </div>           </div>         </div>         <div class="modal-footer">           <button type="button" class="btn-secondary" onclick="closeModal()" data-i18n="btn_cancel">Cancelar</button>           <button type="submit" data-i18n="btn_save">Guardar</button>         </div>       </form>     </div>   </div>    <div id="infobar"></div>    <script src="js/api.js"></script>   <script src="js/config.js"></script>   <script src="js/app.js"></script>   <script>     let allItems = [];     let taxOptions = [];      document.addEventListener('DOMContentLoaded', async () => {       if (!API.isAuthenticated()) { window.location.href = '/login.html'; return; }       await APP.init(); await loadTaxes();       loadItems();     });      document.addEventListener('click', (e) => {       const sidebar = document.getElementById('sidebar');       if (window.innerWidth <= 768 && sidebar.style.display === 'block' && !sidebar.contains(e.target) && !e.target.closest('.hamburger')) {         sidebar.style.display = '';       }     });      async function loadTaxes() {       try {         const data = await API.get('/api/settings/taxes');         taxOptions = data.taxes || data || [];         const sel = document.getElementById('fieldTaxRate');         sel.innerHTML = '<option value="" data-i18n="option_no_tax">Sin impuesto</option>';         taxOptions.forEach(t => {           sel.innerHTML += '<option value="' + APP.esc(t.id || t.name) + '">' + APP.esc(t.name) + ' (' + (t.rate || 0) + '%)</option>';         });       } catch (e) {         console.error('Error loading taxes', e);       }     }      async function loadItems() {       try {         const data = await API.get('/api/items');         allItems = data.items || data.data || (Array.isArray(data) ? data : []);         renderItems(allItems);       } catch (e) {         console.error('Error loading items', e);         document.getElementById('items-body').innerHTML = '<tr><td colspan="8" class="text-center" style="color:#999">Error al cargar productos</td></tr>';       }     }      function filterItems() {       const q = document.getElementById('searchInput').value.toLowerCase().trim();       const filtered = allItems.filter(item => {         return !q ||           (item.code && item.code.toLowerCase().includes(q)) ||           (item.name && item.name.toLowerCase().includes(q)) ||           (item.description && item.description.toLowerCase().includes(q));       });       renderItems(filtered);     }      function renderItems(list) {       const tbody = document.getElementById('items-body');       if (!list.length) {         tbody.innerHTML = '<tr><td colspan="8" class="text-center" style="color:#999">No se encontraron productos</td></tr>';         return;       }       tbody.innerHTML = list.map(item => {         const taxName = item.tax_name || item.tax_rate_name || '';         const imgHtml = item.image_url ? '<img src="' + item.image_url + '" style="width:40px;height:40px;object-fit:cover;border-radius:4px;border:1px solid #eee" alt="foto" onerror="this.style.display=\'none\'">' : '<span style="color:#ccc">-</span>';         const qrHtml = item.qr_code ? '<img src="' + item.qr_code + '" style="width:30px;height:30px;cursor:pointer" alt="QR" title="Código QR" onclick="window.open(this.src)" onerror="this.style.display=\'none\'">' : '<span style="color:#ccc">-</span>';         return '<tr>' +           '<td style="text-align:center;vertical-align:middle">' + imgHtml + '</td>' +           '<td>' + APP.esc(item.code || '-') + '</td>' +           '<td><a href="#" onclick="openEditModal(\'' + item.id + '\')">' + APP.esc(item.name) + '</a></td>' +           '<td>' + APP.formatMoney(item.price) + '</td>' +           '<td>' + APP.esc(taxName) + '</td>' +           '<td>' + (item.track_inventory ? (item.stock_quantity != null ? item.stock_quantity : '-') : '-') + '</td>' +           '<td>' + (item.active !== false ? 'Sí' : 'No') + '</td>' +           '<td>' +             '<button class="btn-secondary" style="min-width:auto;font-size:.85em" onclick="openEditModal(\'' + item.id + '\')" data-i18n="btn_edit">Editar</button> ' +             '<button class="btn-danger" style="min-width:auto;font-size:.85em" onclick="deleteItem(\'' + item.id + '\',\'' + APP.esc(item.name).replace(/'/g, "\\'") + '\')" data-i18n="btn_delete">Eliminar</button>' +           '</td>' +         '</tr>';       }).join('');     }      function openAddModal() {       document.getElementById('modalTitle').textContent = 'Nuevo Producto';       document.getElementById('itemId').value = '';       document.getElementById('itemForm').reset();       document.getElementById('fieldStockQuantity').value = '0';       document.getElementById('fieldStockWarning').value = '0';       document.getElementById('fieldTrackInventory').checked = true;       document.getElementById('fieldActive').checked = true;       document.getElementById('fieldImage').value = '';       document.getElementById('imagePreview').innerHTML = '';       document.getElementById('qrPreview').innerHTML = '<span style="color:#999;font-size:.85em" data-i18n="msg_qr_saved_with_code">Se genera al guardar con el código</span>';       document.getElementById('itemModal').style.display = 'flex';     }      async function openEditModal(id) {       const item = allItems.find(x => x.id === id);       if (!item) return;       document.getElementById('modalTitle').textContent = 'Editar Producto';       document.getElementById('itemId').value = item.id;       document.getElementById('fieldCode').value = item.code || '';       document.getElementById('fieldName').value = item.name || '';       document.getElementById('fieldDescription').value = item.description || '';       document.getElementById('fieldPrice').value = item.price || '';       document.getElementById('fieldCostPrice').value = item.cost_price || '';       document.getElementById('fieldTaxRate').value = item.tax_rate_id || item.tax_id || item.tax_rate || '';       document.getElementById('fieldUnit').value = item.unit || '';       document.getElementById('fieldStockQuantity').value = item.stock_quantity != null ? item.stock_quantity : '0';       document.getElementById('fieldStockWarning').value = item.stock_warning_level != null ? item.stock_warning_level : '0';       document.getElementById('fieldTrackInventory').checked = item.track_inventory !== false;       document.getElementById('fieldActive').checked = item.active !== false;       document.getElementById('fieldImage').value = '';       document.getElementById('imagePreview').innerHTML = item.image_url ? '<img src="' + item.image_url + '" style="max-width:150px;max-height:120px;border:1px solid #eee;border-radius:4px" onerror="this.style.display=\'none\'"><br><button type="button" class="btn-danger" style="font-size:.75em;margin-top:2px" onclick="deleteImage(\'' + item.id + '\',this)" data-i18n="btn_delete_photo">Eliminar foto</button>' : '';       document.getElementById('qrPreview').innerHTML = item.qr_code ? '<img src="' + item.qr_code + '" style="width:80px;height:80px;border:1px solid #eee" onerror="this.style.display=\'none\'">' : '<span style="color:#999;font-size:.85em" data-i18n="msg_qr_saved_with_code">Se genera al guardar con el código</span>';       document.getElementById('itemModal').style.display = 'flex';     }      function closeModal() {       document.getElementById('itemModal').style.display = 'none';     }      function previewImage(e) {       const file = e.target.files[0];       if (!file) { document.getElementById('imagePreview').innerHTML = ''; return; }       const reader = new FileReader();       reader.onload = function(ev) {         document.getElementById('imagePreview').innerHTML = '<img src="' + ev.target.result + '" style="max-width:150px;max-height:120px;border:1px solid #eee;border-radius:4px">';       };       reader.readAsDataURL(file);     }      async function deleteImage(id, btn) {       btn.disabled = true;       try {         await API.del('/api/items/' + id + '/image');         document.getElementById('imagePreview').innerHTML = '';         APP.showMessage('Foto eliminada', 'success');         await loadItems();       } catch (e) { APP.showMessage('Error al eliminar foto', 'error'); }       btn.disabled = false;     }      async function regenerateQr() {       const id = document.getElementById('itemId').value;       if (!id) { APP.showMessage('Guarda el producto primero', 'info'); return; }       try {         await API.post('/api/items/' + id + '/qrcode/generate', {});         APP.showMessage('QR regenerado (tarda unos segundos)', 'success');       } catch (e) { APP.showMessage('Error al generar QR', 'error'); }     }      async function saveItem(e) {       e.preventDefault();       const id = document.getElementById('itemId').value;       const code = document.getElementById('fieldCode').value.trim();       const data = {         code: code,         name: document.getElementById('fieldName').value.trim(),         description: document.getElementById('fieldDescription').value.trim(),         price: parseFloat(document.getElementById('fieldPrice').value) || 0,         cost_price: parseFloat(document.getElementById('fieldCostPrice').value) || 0,         tax_rate_id: document.getElementById('fieldTaxRate').value || null,         unit: document.getElementById('fieldUnit').value.trim(),         stock_quantity: parseInt(document.getElementById('fieldStockQuantity').value) || 0,         stock_warning_level: parseInt(document.getElementById('fieldStockWarning').value) || 0,         track_inventory: document.getElementById('fieldTrackInventory').checked,         active: document.getElementById('fieldActive').checked       };       if (!code) { APP.showMessage('El código del producto es obligatorio', 'error'); return; }       if (!data.name) { APP.showMessage('El nombre del producto es obligatorio', 'error'); return; }       try {         let savedId = id;         if (id) {           await API.put('/api/items/' + id, data);         } else {           const result = await API.post('/api/items', data);           savedId = result.id;         }         APP.showMessage('Producto guardado correctamente', 'success');         closeModal();         loadItems();         const fileInput = document.getElementById('fieldImage');         if (fileInput.files.length > 0) {           const formData = new FormData();           formData.append('image', fileInput.files[0]);           API.upload('/api/items/' + savedId + '/image', formData).catch(function(){});         }       } catch (e) {         APP.showMessage('Error al guardar el producto', 'error');         console.error(e);       }     }      function deleteItem(id, name) {       APP.confirm('Eliminar Producto', '¿Estás seguro de eliminar "' + name + '"? Esta acción no se puede deshacer.', async () => {         try {           await API.del('/api/items/' + id);           APP.showMessage('Producto eliminado correctamente', 'success');           await loadItems();         } catch (e) {           APP.showMessage('Error al eliminar el producto', 'error');           console.error(e);         }       });     } </script> </body> </html>
