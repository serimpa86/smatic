<!DOCTYPE html> <html lang="es"> <head>   <meta charset="utf-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title data-i18n="page_title_customers">Clientes | Smatic</title>   <link rel="stylesheet" href="css/main.css"> </head> <body>   <div class="navigation-wrapper" id="sidebar">
  <nav id="app-nav" class="navigation"></nav>
</div>    <div class="header-wrapper">     <div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">☰</div>     <div class="breadcrumbs">       <img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'">       <span data-i18n="breadcrumb_customers">Smatic - Clientes</span>     </div>   </div>    <div class="container" id="main-content">     <div class="page-header">       <h1 data-i18n="page_title_customers">Clientes</h1>       <div class="actions">         <button onclick="openAddModal()">+ <span data-i18n="btn_add_customer">Agregar Cliente</span></button>       </div>     </div>      <div class="filters">       <div class="search-box">         <input type="text" id="searchInput" data-i18n-placeholder="placeholder_search_customers" placeholder="Buscar clientes..." oninput="filterCustomers()">       </div>       <select id="groupFilter" onchange="filterCustomers()">         <option value="" data-i18n="filter_all_groups">Todos los grupos</option>       </select>     </div>      <div class="card">       <div class="scroll-table">         <table class="record-list" id="customers-table">           <thead>             <tr>               <th data-i18n="th_name">Nombre</th>               <th data-i18n="th_email">Email</th>               <th data-i18n="th_phone">Teléfono</th>               <th data-i18n="th_group">Grupo</th>               <th data-i18n="th_actions">Acciones</th>             </tr>           </thead>           <tbody id="customers-body">             <tr><td colspan="5" class="text-center loading" data-i18n="loading">Cargando...</td></tr>           </tbody>         </table>       </div>     </div>   </div>    <div id="customerModal" class="modal-overlay" style="display:none">     <div class="modal-content">       <button class="modal-close" onclick="closeModal()">&times;</button>       <h2 id="modalTitle" data-i18n="modal_title_add_customer">Agregar Cliente</h2>       <form id="customerForm" onsubmit="saveCustomer(event)">         <input type="hidden" id="customerId">         <div class="invoice-form">           <div class="form-row">             <div>               <label data-i18n="lbl_name_required">Nombre *</label>               <input type="text" id="fieldName" required>             </div>             <div>               <label data-i18n="lbl_email">Email</label>               <input type="email" id="fieldEmail">             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_phone">Teléfono</label>               <input type="text" id="fieldPhone">             </div>             <div>               <label data-i18n="lbl_contact_person">Persona de Contacto</label>               <input type="text" id="fieldContactPerson">             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_billing_address">Dirección de Facturación</label>               <textarea id="fieldBillingAddress" rows="2"></textarea>             </div>             <div>               <label data-i18n="lbl_shipping_address">Dirección de Envío</label>               <textarea id="fieldShippingAddress" rows="2"></textarea>             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_group">Grupo</label>               <input type="text" id="fieldGroup" list="groupList" data-i18n-placeholder="placeholder_group_example" placeholder="Ej: Mayorista">               <datalist id="groupList"></datalist>             </div>             <div>               <label data-i18n="lbl_payment_terms">Términos de Pago</label>               <select id="fieldPaymentTerms">                 <option value="0" data-i18n="payment_term_cash">Contado</option>                 <option value="15" data-i18n="payment_term_15_days">15 Días</option>                 <option value="30" selected data-i18n="payment_term_30_days">30 Días</option>                 <option value="60" data-i18n="payment_term_60_days">60 Días</option>                 <option value="90" data-i18n="payment_term_90_days">90 Días</option>               </select>             </div>           </div>           <div class="form-row">             <div>               <label data-i18n="lbl_notes">Notas</label>               <textarea id="fieldNotes" rows="2"></textarea>             </div>           </div>         </div>         <div class="modal-footer">           <button type="button" class="btn-secondary" onclick="closeModal()" data-i18n="btn_cancel">Cancelar</button>           <button type="submit" data-i18n="btn_save">Guardar</button>         </div>       </form>     </div>   </div>    <div id="infobar"></div>    <script src="js/api.js"></script>   <script src="js/config.js"></script>   <script src="js/app.js"></script>   <script>     let allCustomers = [];      document.addEventListener('DOMContentLoaded', async () => {       if (!API.isAuthenticated()) { window.location.href = '/login.html'; return; }       await APP.init(); loadCustomers();     });      document.addEventListener('click', (e) => {       const sidebar = document.getElementById('sidebar');       if (window.innerWidth <= 768 && sidebar.style.display === 'block' && !sidebar.contains(e.target) && !e.target.closest('.hamburger')) {         sidebar.style.display = '';       }     });      async function loadCustomers() {       try {         const data = await API.get('/api/customers');         allCustomers = data.customers || [];         populateGroupFilter(data.groups || []);         renderCustomers(allCustomers);       } catch (e) {         console.error('Error loading customers', e);         document.getElementById('customers-body').innerHTML = '<tr><td colspan="5" class="text-center" style="color:#999">Error al cargar clientes</td></tr>';       }     }      function populateGroupFilter(groups) {       const sel = document.getElementById('groupFilter');       const current = sel.value;       sel.innerHTML = '<option value="" data-i18n="filter_all_groups">Todos los grupos</option>';       groups.forEach(g => {         sel.innerHTML += '<option value="' + APP.esc(g.group_name) + '">' + APP.esc(g.group_name) + '</option>';       });       sel.value = current;     }      function filterCustomers() {       const q = document.getElementById('searchInput').value.toLowerCase().trim();       const g = document.getElementById('groupFilter').value;       const filtered = allCustomers.filter(c => {         const matchSearch = !q || (c.name && c.name.toLowerCase().includes(q)) || (c.email && c.email.toLowerCase().includes(q)) || (c.phone && c.phone.includes(q));         const matchGroup = !g || c.group_name === g;         return matchSearch && matchGroup;       });       renderCustomers(filtered);     }      function renderCustomers(list) {       const tbody = document.getElementById('customers-body');       if (!list.length) {         tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="color:#999">No se encontraron clientes</td></tr>';         return;       }       tbody.innerHTML = list.map(c => {         const groupLabel = c.group_name ? APP.esc(c.group_name) : '<span style="color:#999">—</span>';         return '<tr>' +           '<td><a href="#" onclick="openEditModal(\'' + c.id + '\')">' + APP.esc(c.name) + '</a></td>' +           '<td>' + APP.esc(c.email || '') + '</td>' +           '<td>' + APP.esc(c.phone || '') + '</td>' +           '<td>' + groupLabel + '</td>' +           '<td>' +             '<button class="btn-secondary" style="min-width:auto;font-size:.85em" onclick="openEditModal(\'' + c.id + '\')" data-i18n="btn_edit">Editar</button> ' +             '<button class="btn-danger" style="min-width:auto;font-size:.85em" onclick="deleteCustomer(\'' + c.id + '\',\'' + APP.esc(c.name).replace(/'/g, "\\'") + '\')" data-i18n="btn_delete">Eliminar</button>' +           '</td>' +         '</tr>';       }).join('');     }      function openAddModal() {       document.getElementById('modalTitle').textContent = 'Agregar Cliente';       document.getElementById('customerId').value = '';       document.getElementById('customerForm').reset();       document.getElementById('fieldPaymentTerms').value = '30';       document.getElementById('customerModal').style.display = 'flex';     }      async function openEditModal(id) {       const c = allCustomers.find(x => x.id === id);       if (!c) return;       document.getElementById('modalTitle').textContent = 'Editar Cliente';       document.getElementById('customerId').value = c.id;       document.getElementById('fieldName').value = c.name || '';       document.getElementById('fieldEmail').value = c.email || '';       document.getElementById('fieldPhone').value = c.phone || '';       document.getElementById('fieldContactPerson').value = c.contact_person || '';       document.getElementById('fieldBillingAddress').value = c.billing_address || '';       document.getElementById('fieldShippingAddress').value = c.shipping_address || '';       document.getElementById('fieldGroup').value = c.group_name || '';       document.getElementById('fieldPaymentTerms').value = c.payment_terms || '30';       document.getElementById('fieldNotes').value = c.notes || '';       document.getElementById('customerModal').style.display = 'flex';     }      function closeModal() {       document.getElementById('customerModal').style.display = 'none';     }      async function saveCustomer(e) {       e.preventDefault();       const id = document.getElementById('customerId').value;       const data = {         name: document.getElementById('fieldName').value.trim(),         email: document.getElementById('fieldEmail').value.trim(),         phone: document.getElementById('fieldPhone').value.trim(),         contact_person: document.getElementById('fieldContactPerson').value.trim(),         billing_address: document.getElementById('fieldBillingAddress').value.trim(),         shipping_address: document.getElementById('fieldShippingAddress').value.trim(),         group_name: document.getElementById('fieldGroup').value.trim(),         payment_terms: document.getElementById('fieldPaymentTerms').value,         notes: document.getElementById('fieldNotes').value.trim()       };       if (!data.name) { APP.showMessage('El nombre del cliente es obligatorio', 'error'); return; }       try {         if (id) {           await API.put('/api/customers/' + id, data);           APP.showMessage('Cliente actualizado correctamente', 'success');         } else {           await API.post('/api/customers', data);           APP.showMessage('Cliente creado correctamente', 'success');         }         closeModal();         await loadCustomers();       } catch (e) {         APP.showMessage('Error al guardar el cliente', 'error');         console.error(e);       }     }      function deleteCustomer(id, name) {       APP.confirm('Eliminar Cliente', '¿Estás seguro de eliminar a "' + name + '"? Esta acción no se puede deshacer.', async () => {         try {           await API.del('/api/customers/' + id);           APP.showMessage('Cliente eliminado correctamente', 'success');           await loadCustomers();         } catch (e) {           APP.showMessage('Error al eliminar el cliente', 'error');           console.error(e);         }       });     } </script> </body> </html>
