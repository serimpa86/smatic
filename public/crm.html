<!DOCTYPE html><html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | Smatic</title><link rel="stylesheet" href="css/main.css">
<style>
.pipeline { display:flex; gap:1em; overflow-x:auto; align-items:flex-start; }
.pipeline-col { min-width:18em; max-width:22em; flex:1; background:#f5f5f5; border-radius:6px; padding:.5em; }
.pipeline-col h3 { font-size:.9em; margin:0 0 .5em; padding:.3em .5em; background:#fff; border-radius:4px; display:flex; justify-content:space-between; }
.pipeline-col .deal-card { background:#fff; border:1px solid #e0e0e0; border-radius:4px; padding:.5em; margin-bottom:.5em; cursor:pointer; transition:box-shadow .15s; }
.pipeline-col .deal-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.1); }
.pipeline-col .deal-card .deal-title { font-weight:600; font-size:.9em; }
.pipeline-col .deal-card .deal-value { font-size:.85em; color:#444; }
.pipeline-col .deal-card .deal-customer { font-size:.8em; color:#888; }
.pipeline-col .deal-card .deal-prob { font-size:.75em; color:#666; }
.stage-lead { border-top:3px solid #6c757d; }
.stage-qualified { border-top:3px solid #007bff; }
.stage-proposal { border-top:3px solid #ffc107; }
.stage-negotiation { border-top:3px solid #fd7e14; }
.stage-won { border-top:3px solid #28a745; }
.stage-lost { border-top:3px solid #dc3545; }
</style>
</head>
<body>
<div class="navigation-wrapper" id="sidebar">
  <nav id="app-nav" class="navigation"></nav>
</div>
<div class="header-wrapper"><div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">☰</div><div class="breadcrumbs"><img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'"><span>Smatic - CRM</span></div></div>
<div class="container">
<div class="page-header"><h1>CRM</h1><div class="actions">
<button onclick="openDealModal(null)">+ Nueva Oportunidad</button>
<button onclick="openActivityModal()">+ Actividad</button>
</div></div>
<div class="tab-bar">
<button class="active" onclick="switchTab('pipeline',this)" data-i18n="crm_tab_pipeline">Embudo de ventas</button>
<button onclick="switchTab('activities',this)">Actividades</button>
</div>
<div class="tab-content active" id="tab-pipeline">
<div class="filters">
<select id="stageFilter" onchange="loadPipeline()"><option value="">Todas las etapas</option><option value="lead">Lead</option><option value="qualified">Calificado</option><option value="proposal">Propuesta</option><option value="negotiation">Negociación</option><option value="won">Ganado</option><option value="lost">Perdido</option></select>
<input type="text" id="searchDeal" placeholder="Buscar..." oninput="loadPipeline()">
</div>
<div class="pipeline" id="pipelineContainer"><div class="loading">Cargando...</div></div>
</div>
<div class="tab-content" id="tab-activities">
<div class="filters">
<select id="actTypeFilter" onchange="loadActivities()"><option value="">Todas</option><option value="call">Llamada</option><option value="email">Email</option><option value="meeting">Reunión</option><option value="task">Tarea</option><option value="follow_up">Seguimiento</option><option value="note">Nota</option></select>
<select id="actCompletedFilter" onchange="loadActivities()"><option value="">Todas</option><option value="0">Pendientes</option><option value="1">Completadas</option></select>
</div>
<div id="activitiesContainer"><div class="loading">Cargando...</div></div>
</div>
</div>
<script src="js/api.js"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if(!API.isAuthenticated()){window.location.href='/login.html';return;}
  await APP.init();
  if(APP.currentUser&&APP.currentUser.role==='superadmin')document.getElementById('admin-nav-link').classList.remove('hidden');
  loadPipeline();
});
function switchTab(tab,btn){
  document.querySelectorAll('.tab-bar button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='pipeline')loadPipeline();
  else loadActivities();
}
const stageLabels={lead:'Prospecto',qualified:'Calificado',proposal:'Propuesta',negotiation:'Negociación',won:'Ganado',lost:'Perdido'};
async function loadPipeline(){
  const stage=document.getElementById('stageFilter').value;
  const search=document.getElementById('searchDeal').value;
  let url='/api/crm/deals/pipeline';
  try{
    const d=await API.get(url);
    renderPipeline(d.pipeline||{},d.totals||{});
  }catch(e){document.getElementById('pipelineContainer').innerHTML='<div style="color:#d93025">Error</div>';}
}
function renderPipeline(pipeline,totals){
  const stages=['lead','qualified','proposal','negotiation','won','lost'];
  let html='';
  for(const s of stages){
    const deals=(pipeline[s]||[]).filter(d=>{
      const stageF=document.getElementById('stageFilter').value;
      const search=document.getElementById('searchDeal').value.toLowerCase();
      if(stageF&&d.stage!==stageF)return false;
      if(search&&!d.title.toLowerCase().includes(search)&&!d.customer_name.toLowerCase().includes(search))return false;
      return true;
    });
    html+='<div class="pipeline-col"><h3>'+stageLabels[s]+' <span style="color:#888;font-size:.85em">'+APP.formatMoney(totals[s]||0)+' ('+deals.length+')</span></h3>';
    for(const d of deals){
      html+='<div class="deal-card stage-'+d.stage+'" onclick="openDealModal(\''+d.id+'\')">'+
        '<div class="deal-title">'+APP.esc(d.title)+'</div>'+
        '<div class="deal-customer">'+APP.esc(d.customer_name)+'</div>'+
        '<div class="deal-value">'+APP.formatMoney(d.value)+'</div>'+
        '<div class="deal-prob">Prob: '+d.probability+'% | '+APP.esc(d.source)+'</div>'+
      '</div>';
    }
    if(deals.length===0)html+='<div style="color:#aaa;font-size:.85em;padding:.5em;text-align:center">Sin oportunidades</div>';
    html+='</div>';
  }
  document.getElementById('pipelineContainer').innerHTML=html;
}
async function loadActivities(){
  const type=document.getElementById('actTypeFilter').value;
  const completed=document.getElementById('actCompletedFilter').value;
  let url='/api/crm/activities?';
  if(type)url+='type='+type+'&';
  if(completed!=='')url+='completed='+completed+'&';
  try{
    const d=await API.get(url);
    renderActivities(d.activities||[]);
  }catch(e){document.getElementById('activitiesContainer').innerHTML='<div style="color:#d93025">Error</div>';}
}
const typeLabels={call:'📞 Llamada',email:'📧 Email',meeting:'🤝 Reunión',task:'✅ Tarea',follow_up:'🔄 Seguimiento',note:'📝 Nota'};
function renderActivities(list){
  if(!list.length){document.getElementById('activitiesContainer').innerHTML='<div style="text-align:center;padding:2em;color:#999">Sin actividades.</div>';return;}
  let html='<table class="record-list"><thead><tr><th>Tipo</th><th>Asunto</th><th>Descripción</th><th>Vencimiento</th><th>Estado</th><th>Acción</th></tr></thead><tbody>';
  for(const a of list){
    html+='<tr><td>'+(typeLabels[a.type]||a.type)+'</td><td>'+APP.esc(a.subject)+'</td><td>'+APP.esc(a.description)+'</td><td>'+(a.due_date||'')+'</td><td>'+(a.completed?'✓ Completa':'⏳ Pendiente')+'</td><td><button class="btn-secondary" style="min-width:auto;padding:.2em .6em" onclick="toggleActivity(\''+a.id+'\','+(a.completed?0:1)+')">'+(a.completed?'Reabrir':'Completar')+'</button></td></tr>';
  }
  html+='</tbody></table>';
  document.getElementById('activitiesContainer').innerHTML=html;
}
let customersCache=[];
async function openDealModal(id){
  try{
    const cd=await API.get('/api/customers');
    customersCache=cd.customers||[];
    let deal=null;
    if(id)deal=await API.get('/api/crm/deals/'+id);
    const custOpts='<option value="">Sin cliente</option>'+customersCache.map(c=>'<option value="'+c.id+'" '+(deal&&deal.customer_id===c.id?'selected':'')+'>'+APP.esc(c.name)+'</option>').join('');
    const html='<div class="modal-content" style="max-width:500px"><span class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</span><h2>'+(deal?'Editar Oportunidad':'Nueva Oportunidad')+'</h2>'+
      '<div class="settings-grid">'+
      '<div><label>Título</label><input id="dTitle" value="'+(deal?APP.esc(deal.title):'')+'"></div>'+
      '<div><label>Cliente</label><select id="dCust" style="width:100%">'+custOpts+'</select></div>'+
      '<div><label>Valor</label><input type="number" step="0.01" id="dValue" value="'+(deal?deal.value:'')+'"></div>'+
      '<div><label>Etapa</label><select id="dStage">'+
        '<option value="lead"'+(deal&&deal.stage==='lead'?' selected':'')+'>Lead</option>'+
        '<option value="qualified"'+(deal&&deal.stage==='qualified'?' selected':'')+'>Calificado</option>'+
        '<option value="proposal"'+(deal&&deal.stage==='proposal'?' selected':'')+'>Propuesta</option>'+
        '<option value="negotiation"'+(deal&&deal.stage==='negotiation'?' selected':'')+'>Negociación</option>'+
        '<option value="won"'+(deal&&deal.stage==='won'?' selected':'')+'>Ganado</option>'+
        '<option value="lost"'+(deal&&deal.stage==='lost'?' selected':'')+'>Perdido</option>'+
      '</select></div>'+
      '<div><label>Probabilidad (%)</label><input type="number" id="dProb" value="'+(deal?deal.probability:'0')+'"></div>'+
      '<div><label>Cierre estimado</label><input type="date" id="dClose" value="'+(deal?deal.expected_close_date:'')+'"></div>'+
      '<div><label>Origen</label><select id="dSource"><option value=""'+(deal&&!deal.source?' selected':'')+'>Seleccionar...</option><option value="web"'+(deal&&deal.source==='web'?' selected':'')+'>Web</option><option value="referral"'+(deal&&deal.source==='referral'?' selected':'')+'>Referido</option><option value="call"'+(deal&&deal.source==='call'?' selected':'')+'>Llamada</option><option value="email"'+(deal&&deal.source==='email'?' selected':'')+'>Email</option><option value="other"'+(deal&&deal.source==='other'?' selected':'')+'>Otro</option></select></div>'+
      '<div style="grid-column:1/-1"><label>Notas</label><textarea id="dNotes">'+(deal?APP.esc(deal.notes):'')+'</textarea></div>'+
      '</div><div class="modal-footer"><button class="btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">Cancelar</button><button onclick="saveDeal(\''+(deal?deal.id:'')+'\')">Guardar</button></div></div>';
    APP.modal(html,'');
  }catch(e){alert('Error');}
}
async function saveDeal(id){
  const data={
    title:document.getElementById('dTitle').value,
    customer_id:document.getElementById('dCust').value,
    customer_name:document.getElementById('dCust').selectedOptions[0]?.textContent||'',
    value:parseFloat(document.getElementById('dValue').value)||0,
    stage:document.getElementById('dStage').value,
    probability:parseInt(document.getElementById('dProb').value)||0,
    expected_close_date:document.getElementById('dClose').value,
    source:document.getElementById('dSource').value,
    notes:document.getElementById('dNotes').value
  };
  if(!data.title){alert('Título obligatorio');return;}
  try{
    if(id)await API.put('/api/crm/deals/'+id,data);
    else await API.post('/api/crm/deals',data);
    document.querySelector('.modal-overlay').remove();
    loadPipeline();
  }catch(e){alert('Error: '+(e.message||''));}
}
async function openActivityModal(){
  const html='<div class="modal-content" style="max-width:450px"><span class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</span><h2>Nueva Actividad</h2>'+
    '<div class="settings-grid">'+
    '<div><label>Tipo</label><select id="aType"><option value="call">Llamada</option><option value="email">Email</option><option value="meeting">Reunión</option><option value="task">Tarea</option><option value="follow_up">Seguimiento</option><option value="note">Nota</option></select></div>'+
    '<div><label>Asunto</label><input id="aSubject"></div>'+
    '<div style="grid-column:1/-1"><label>Descripción</label><textarea id="aDesc"></textarea></div>'+
    '<div><label>Vencimiento</label><input type="date" id="aDue"></div>'+
    '</div><div class="modal-footer"><button class="btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">Cancelar</button><button onclick="saveActivity()">Guardar</button></div></div>';
  APP.modal(html,'');
}
async function saveActivity(){
  const data={type:document.getElementById('aType').value,subject:document.getElementById('aSubject').value,description:document.getElementById('aDesc').value,due_date:document.getElementById('aDue').value};
  if(!data.subject){alert('Asunto obligatorio');return;}
  try{await API.post('/api/crm/activities',data);document.querySelector('.modal-overlay').remove();loadActivities();}catch(e){alert('Error: '+(e.message||''));}
}
async function toggleActivity(id,completed){
  try{await API.put('/api/crm/activities/'+id,{completed});loadActivities();}catch(e){alert('Error');}
}
</script>
</body>
</html>
