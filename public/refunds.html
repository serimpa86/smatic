<!DOCTYPE html> <html lang="es"> <head>   <meta charset="utf-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title data-i18n="page_title_refunds">Reembolsos | Smatic</title>   <link rel="stylesheet" href="css/main.css">   <style>     .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 60; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 2em 0; }     .modal-content { background: #fff; margin: auto; padding: 2em; border-radius: 8px; max-width: 600px; width: 95%; box-shadow: 0 4px 20px rgba(0,0,0,0.2); position: relative; }     .modal-close { position: absolute; top: .8em; right: 1em; font-size: 1.5em; cursor: pointer; color: #999; background: none; border: none; }     .modal-close:hover { color: #333; }     .modal-footer { display: flex; gap: .5em; justify-content: flex-end; margin-top: 1.5em; }     .invoice-form { background: #fff; padding: 1.5em; border: 1px solid #e0e0e0; }     .invoice-form .form-row { display: flex; gap: 1em; margin-bottom: .75em; flex-wrap: wrap; }     .invoice-form .form-row > * { flex: 1; min-width: 14em; }     .invoice-form label { display: block; font-size: .85em; color: #666; margin-bottom: .25em; font-weight: 600; }     .invoice-form input, .invoice-form textarea, .invoice-form select { width: 100%; }     .invoice-form textarea { min-height: 4em; resize: vertical; }   </style> </head> <body>   <div class="navigation-wrapper" id="sidebar">
  <nav id="app-nav" class="navigation"></nav>
</div>    <div class="header-wrapper">     <div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">☰</div>     <div class="breadcrumbs">       <img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'">       <span data-i18n="breadcrumb_refunds">Smatic - Reembolsos</span>     </div>   </div>    <div class="container" id="main-content">     <div class="page-header">       <h1 data-i18n="page_title_refunds">Reembolsos</h1>       <div class="actions">         <button onclick="showCreateModal()">+ <span data-i18n="btn_new_refund">Nuevo Reembolso</span></button>       </div>     </div>      <div class="filters">       <div class="search-box">         <input type="text" id="filter-search" data-i18n-placeholder="placeholder_search_refunds" placeholder="Buscar por número o cliente...">         <button onclick="applyFilters()" data-i18n="btn_search">Buscar</button>       </div>     </div>      <div class="card">       <div class="scroll-table">         <table class="record-list" id="refunds-table">           <thead>             <tr>               <th data-i18n="th_refund_number">N° Reembolso</th>               <th data-i18n="th_customer">Cliente</th>               <th data-i18n="th_related_payment">Pago Relacionado</th>               <th data-i18n="th_date">Fecha</th>               <th data-i18n="th_amount">Monto</th>               <th data-i18n="th_reason">Razón</th>               <th data-i18n="th_actions">Acciones</th>             </tr>           </thead>           <tbody id="refunds-body">             <tr><td colspan="7" class="text-center" style="color:#999" data-i18n="loading">Cargando...</td></tr>           </tbody>         </table>       </div>     </div>      <div id="pagination" class="pagination"></div>   </div>    <div id="infobar"></div>    <script src="js/api.js"></script>   <script src="js/config.js"></script>   <script src="js/app.js"></script>   <script>     let refunds = [];     let payments = [];     let customers = [];      document.addEventListener('DOMContentLoaded', async () => {       if (!API.isAuthenticated()) { window.location.href = '/login.html'; return; }       await APP.init(); loadRefunds();     });      document.addEventListener('click', (e) => {       const sidebar = document.getElementById('sidebar');       if (window.innerWidth <= 768 && sidebar.style.display === 'block' && !sidebar.contains(e.target) && !e.target.closest('.hamburger')) {         sidebar.style.display = '';       }     });      document.getElementById('filter-search').addEventListener('keydown', (e) => {       if (e.key === 'Enter') applyFilters();     });      async function loadRefunds() {       try {         const search = document.getElementById('filter-search').value;         let url = '/api/refunds';         if (search) url += '?search=' + encodeURIComponent(search);         const data = await API.get(url);         refunds = data.refunds || [];         renderRefunds();       } catch (e) { console.error(e); }     }      function applyFilters() { loadRefunds(); }      function renderRefunds() {       const tbody = document.getElementById('refunds-body');       if (!refunds.length) {         tbody.innerHTML = '<tr><td colspan="7" class="text-center" style="color:#999">Sin reembolsos</td></tr>';         return;       }       tbody.innerHTML = refunds.map(r => `         <tr>           <td>${APP.esc(r.refund_number)}</td>           <td>${APP.esc(r.customer_name || '—')}</td>           <td>${r.payment_number ? APP.esc(r.payment_number) : '—'}</td>           <td>${r.date || '—'}</td>           <td>${APP.formatMoney(r.amount || 0)}</td>           <td>${APP.esc((r.reason || '').substring(0, 40))}</td>           <td>             <button class="btn-sm btn-outline" onclick="viewRefund('${r.id}')" data-i18n="btn_view">Ver</button>             <button class="btn-sm btn-outline" onclick="deleteRefund('${r.id}')" style="color:#dc3545;border-color:#dc3545" data-i18n="btn_delete">Eliminar</button>           </td>         </tr>       `).join('');     }      async function showCreateModal() {       try {         const [payData, custData] = await Promise.all([           API.get('/api/payments'),           API.get('/api/customers')         ]);         payments = payData.payments || [];         customers = custData.customers || [];       } catch (e) { console.error(e); }        const payOpts = payments.map(p => `<option value="${p.id}" data-cust="${APP.esc(p.customer_name || '')}" data-amount="${p.amount || 0}">${APP.esc(p.payment_number)} - ${APP.esc(p.customer_name)} (${APP.formatMoney(p.amount)})</option>`).join('');       const html = `         <div class="invoice-form">           <div class="form-row">             <div><label data-i18n="lbl_related_payment">Pago Relacionado</label><select id="ref-payment" onchange="refPaymentChange()"><option value="" data-i18n="option_without_payment">— Sin pago —</option>${payOpts}</select></div>             <div><label data-i18n="lbl_customer">Cliente</label><select id="ref-customer"><option value="" data-i18n="option_select">Seleccionar...</option>${customers.map(c => '<option value="' + c.id + '">' + APP.esc(c.name) + '</option>').join('')}</select></div>           </div>           <div class="form-row">             <div><label data-i18n="lbl_date">Fecha</label><input type="date" id="ref-date" value="${new Date().toISOString().split('T')[0]}"></div>             <div><label data-i18n="lbl_amount">Monto</label><input type="number" id="ref-amount" step="0.01" min="0"></div>           </div>           <div class="form-row">             <div><label data-i18n="lbl_reason">Razón</label><textarea id="ref-reason" data-i18n-placeholder="placeholder_refund_reason" placeholder="Motivo del reembolso"></textarea></div>           </div>           <div class="modal-footer">             <button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()" data-i18n="btn_cancel">Cancelar</button>             <button class="btn" onclick="saveRefund()" data-i18n="btn_save_refund">Guardar Reembolso</button>           </div>         </div>`;       APP.modal(html, APP.t('modal_title_new_refund', 'Nuevo Reembolso'));     }      window.refPaymentChange = function() {       const sel = document.getElementById('ref-payment');       const opt = sel.options[sel.selectedIndex];       if (opt && opt.value) {         const custName = opt.getAttribute('data-cust') || '';         const amount = opt.getAttribute('data-amount') || 0;         document.getElementById('ref-amount').value = amount;         const cust = customers.find(c => c.name === custName);         if (cust) document.getElementById('ref-customer').value = cust.id;       }     };      window.saveRefund = async function() {       const payId = document.getElementById('ref-payment').value;       const custId = document.getElementById('ref-customer').value;       const date = document.getElementById('ref-date').value;       const amount = parseFloat(document.getElementById('ref-amount').value) || 0;       const reason = document.getElementById('ref-reason').value.trim();       const cust = customers.find(c => c.id === custId);       if (!amount) { APP.showMessage('Ingrese un monto', 'error'); return; }       try {         const result = await API.post('/api/refunds', {           payment_id: payId || null,           customer_id: custId || null,           customer_name: cust ? cust.name : '',           amount,           reason,           date         });         if (result.errorcode) { APP.showMessage(result.errormsg || 'Error', 'error'); return; }         APP.showMessage('Reembolso creado: ' + result.refund_number, 'success');         document.querySelector('.modal-overlay')?.remove();         loadRefunds();       } catch (e) { APP.showMessage('Error al crear reembolso', 'error'); }     };      window.viewRefund = async function(id) {       try {         const r = await API.get('/api/refunds/' + id);         const html = `           <div style="min-width:350px">             <p><strong data-i18n="th_refund_number">N° Reembolso:</strong> ${APP.esc(r.refund_number)}</p>             <p><strong data-i18n="th_customer">Cliente:</strong> ${APP.esc(r.customer_name || '—')}</p>             <p><strong data-i18n="th_date">Fecha:</strong> ${r.date || '—'}</p>             <p><strong data-i18n="th_amount">Monto:</strong> ${APP.formatMoney(r.amount)}</p>             ${r.reason ? '<p><strong data-i18n="th_reason">Razón:</strong> ' + APP.esc(r.reason) + '</p>' : ''}             <div class="modal-footer"><button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove()" data-i18n="btn_close">Cerrar</button></div>           </div>`;         APP.modal(html, 'Reembolso #' + r.refund_number);       } catch (e) { APP.showMessage('Error al cargar reembolso', 'error'); }     };      window.deleteRefund = async function(id) {       if (!confirm('¿Eliminar este reembolso?')) return;       try {         await API.del('/api/refunds/' + id);         APP.showMessage('Reembolso eliminado', 'success');         loadRefunds();       } catch (e) { APP.showMessage('Error al eliminar', 'error'); }     }; </script> </body> </html>
