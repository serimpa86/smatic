<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empleados | Smatic</title><link rel="stylesheet" href="css/main.css"></head>
<body>
<div class="navigation-wrapper"><nav class="navigation">
<div class="sidebar-brand"><img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'"><span>Smatic</span></div>
<ul>

<li><a href="payments.html">💳 <span>Pagos</span></a></li>
<li><a href="refunds.html">💸 <span>Reembolsos</span></a></li>

<li><a href="reports.html">📈 <span>Reportes</span></a></li>

</ul>

</nav></div>
<div class="header-wrapper"><div class="hamburger" onclick="document.getElementById('sidebar').style.display='block'">☰</div><div class="breadcrumbs"><img src="images/logo.png" alt="Smatic" onerror="this.style.display='none'"><span>Smatic - Empleados</span></div></div>
<div class="container">
<div class="page-header"><h1>Empleados</h1><div class="actions"><button onclick="openAdd()">+ Nuevo Empleado</button></div></div>
<div class="filters"><input type="text" id="searchInput" placeholder="Buscar..." oninput="loadEmps()"></div>
<div class="card" id="empContainer"><div class="loading">Cargando...</div></div>
</div>
<script src="js/api.js"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!API.isAuthenticated()) { window.location.href = '/login.html'; return; }
  await APP.init();
  if (APP.currentUser && APP.currentUser.role === 'superadmin') document.getElementById('admin-nav-link').classList.remove('hidden');
  loadEmps();
});
async function loadEmps() {
  const q = document.getElementById('searchInput').value;
  try {
    const d = await API.get('/api/employees' + (q ? '?search=' + encodeURIComponent(q) : ''));
    renderEmps(d.employees || []);
  } catch(e) { document.getElementById('empContainer').innerHTML = '<div style="color:#d93025">Error</div>'; }
}
function renderEmps(list) {
  if (!list.length) { document.getElementById('empContainer').innerHTML = '<div style="text-align:center;padding:2em;color:#999">No hay empleados.</div>'; return; }
  let html = '<table class="record-list"><thead><tr><th>Código</th><th>Apellido</th><th>Nombre</th><th>DNI</th><th>CUIL</th><th>Cargo</th><th>Depto.</th><th>Sueldo</th><th>Activo</th><th>Acción</th></tr></thead><tbody>';
  for (const e of list) {
    html += '<tr><td>' + APP.esc(e.code) + '</td><td>' + APP.esc(e.last_name) + '</td><td>' + APP.esc(e.first_name) + '</td><td>' + APP.esc(e.dni) + '</td><td>' + APP.esc(e.cuil) + '</td><td>' + APP.esc(e.position) + '</td><td>' + APP.esc(e.department) + '</td><td>' + APP.formatMoney(e.salary) + '</td><td>' + (e.is_active ? '✓' : '✗') + '</td><td><button class="btn-secondary" style="min-width:auto;padding:.2em .6em" onclick="editEmp(\'' + e.id + '\')">✏️</button></td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('empContainer').innerHTML = html;
}
function openAdd() { showModal(null); }
async function editEmp(id) { try { const d = await API.get('/api/employees/' + id); showModal(d); } catch(e) { alert('Error'); } }
function showModal(e) {
  const isEdit = !!e;
  const html = '<div class="modal-content" style="max-width:650px"><span class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</span><h2>' + (isEdit ? 'Editar Empleado' : 'Nuevo Empleado') + '</h2>' +
    '<div class="settings-grid">' +
    '<div><label>Código</label><input id="fCode" value="' + (e ? APP.esc(e.code) : '') + '"></div>' +
    '<div><label>Apellido</label><input id="fLast" value="' + (e ? APP.esc(e.last_name) : '') + '"></div>' +
    '<div><label>Nombre</label><input id="fFirst" value="' + (e ? APP.esc(e.first_name) : '') + '"></div>' +
    '<div><label>DNI</label><input id="fDni" value="' + (e ? APP.esc(e.dni) : '') + '"></div>' +
    '<div><label>CUIL</label><input id="fCuil" value="' + (e ? APP.esc(e.cuil) : '') + '"></div>' +
    '<div><label>Fecha nac.</label><input type="date" id="fBirth" value="' + (e ? e.birth_date : '') + '"></div>' +
    '<div><label>Dirección</label><input id="fAddr" value="' + (e ? APP.esc(e.address) : '') + '"></div>' +
    '<div><label>Teléfono</label><input id="fPhone" value="' + (e ? APP.esc(e.phone) : '') + '"></div>' +
    '<div><label>Email</label><input id="fEmail" value="' + (e ? APP.esc(e.email) : '') + '"></div>' +
    '<div><label>Cargo</label><input id="fPos" value="' + (e ? APP.esc(e.position) : '') + '"></div>' +
    '<div><label>Departamento</label><input id="fDept" value="' + (e ? APP.esc(e.department) : '') + '"></div>' +
    '<div><label>F. ingreso</label><input type="date" id="fHire" value="' + (e ? e.hire_date : '') + '"></div>' +
    '<div><label>Sueldo mensual</label><input type="number" step="0.01" id="fSalary" value="' + (e ? e.salary : '') + '"></div>' +
    '<div><label>Tipo salario</label><select id="fSalType"><option value="monthly"' + (e && e.salary_type === 'monthly' ? ' selected' : '') + '>Mensual</option><option value="hourly"' + (e && e.salary_type === 'hourly' ? ' selected' : '') + '>Por hora</option><option value="daily"' + (e && e.salary_type === 'daily' ? ' selected' : '') + '>Por día</option></select></div>' +
    '<div><label>Banco</label><input id="fBank" value="' + (e ? APP.esc(e.bank_name) : '') + '"></div>' +
    '<div><label>CBU</label><input id="fCbu" value="' + (e ? APP.esc(e.cbu) : '') + '"></div>' +
    '<div><label>Obra Social</label><input id="fHealth" value="' + (e ? APP.esc(e.health_insurance) : '') + '"></div>' +
    '<div><label>Sindicato</label><input id="fUnion" value="' + (e ? APP.esc(e.union_name) : '') + '"></div>' +
    (isEdit ? '<div><label><input type="checkbox" id="fActive"' + (e.is_active ? ' checked' : '') + '> Activo</label></div>' : '') +
    '</div><div class="modal-footer"><button class="btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">Cancelar</button><button onclick="saveEmp(\'' + (isEdit ? e.id : '') + '\')">Guardar</button></div></div>';
  APP.modal(html, '');
}
async function saveEmp(id) {
  const data = { code: document.getElementById('fCode').value, last_name: document.getElementById('fLast').value, first_name: document.getElementById('fFirst').value, dni: document.getElementById('fDni').value, cuil: document.getElementById('fCuil').value, birth_date: document.getElementById('fBirth').value, address: document.getElementById('fAddr').value, phone: document.getElementById('fPhone').value, email: document.getElementById('fEmail').value, position: document.getElementById('fPos').value, department: document.getElementById('fDept').value, hire_date: document.getElementById('fHire').value, salary: parseFloat(document.getElementById('fSalary').value) || 0, salary_type: document.getElementById('fSalType').value, bank_name: document.getElementById('fBank').value, cbu: document.getElementById('fCbu').value, health_insurance: document.getElementById('fHealth').value, union_name: document.getElementById('fUnion').value };
  if (id) data.is_active = document.getElementById('fActive').checked ? 1 : 0;
  if (!data.first_name || !data.last_name) { alert('Nombre y apellido obligatorios'); return; }
  try {
    if (id) await API.put('/api/employees/' + id, data); else await API.post('/api/employees', data);
    document.querySelector('.modal-overlay').remove(); loadEmps();
  } catch(e) { alert('Error: ' + (e.message || '')); }
}
</script>
</body>
</html>
